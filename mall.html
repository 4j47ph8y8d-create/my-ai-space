<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>街角商店 · LunarReverie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #ece8e4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 8px; 
            font-family: 'Noto Serif SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', serif;
        }
        .phone-frame { 
            width: 100%; 
            max-width: 390px; 
            height: 780px; 
            background: #f5f3f0; 
            border-radius: 28px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.04), 0 8px 48px rgba(0,0,0,0.02); 
            overflow: hidden; 
            position: relative; 
        }

        :root { 
            --bg: #f5f3f0; 
            --bg-card: #faf9f7; 
            --bg-input: #f0eeeb; 
            --text-primary: #6b6864; 
            --text-secondary: #a8a39c; 
            --text-light: #c5c0b8; 
            --border: #e8e4df; 
            --shadow: rgba(0,0,0,0.03); 
            --shadow-hover: rgba(0,0,0,0.06); 
            --accent: #b5aea6; 
            --accent-soft: #d6d0c8; 
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d0c8; border-radius: 4px; }

        .screen-mall { 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            padding: 12px 14px 0; 
        }

        .mall-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 4px 0 8px; 
            flex-shrink: 0; 
        }
        .mall-header .back-btn { 
            font-size: 18px; 
            color: var(--text-secondary); 
            cursor: pointer; 
            border: none; 
            background: none; 
            padding: 4px; 
            opacity: 0.6; 
            transition: 0.2s; 
        }
        .mall-header .back-btn:active { opacity: 0.3; }
        .mall-header .title { 
            font-size: 13px; 
            font-weight: 300; 
            color: var(--text-secondary); 
            letter-spacing: 4px; 
            font-family: 'Noto Serif SC', serif; 
        }
        .mall-header .mall-actions { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .mall-header .mall-balance { 
            font-size: 11px; 
            color: var(--text-secondary); 
            background: rgba(0,0,0,0.02); 
            padding: 3px 10px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            transition: 0.15s; 
            letter-spacing: 0.3px; 
        }
        .mall-header .mall-balance:active { background: rgba(0,0,0,0.04); }
        .mall-header .mall-balance span { color: var(--text-primary); font-weight: 400; }
        .mall-header .mall-cart-btn { 
            background: none; 
            border: none; 
            font-size: 16px; 
            color: var(--text-secondary); 
            cursor: pointer; 
            position: relative; 
            padding: 4px; 
            opacity: 0.7; 
        }
        .mall-header .mall-cart-btn .cart-count { 
            position: absolute; 
            top: -2px; 
            right: -2px; 
            background: #b5aea6; 
            color: #fff; 
            font-size: 8px; 
            font-weight: 400; 
            min-width: 16px; 
            height: 16px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 4px; 
            letter-spacing: 0; 
        }
        .mall-header .mall-cart-btn .cart-count.empty { display: none; }
        .mall-header .mall-invite-btn { 
            background: rgba(0,0,0,0.02); 
            border: 1px solid var(--border); 
            color: var(--text-secondary); 
            padding: 3px 12px; 
            border-radius: 20px; 
            font-size: 10px; 
            cursor: pointer; 
            font-family: inherit; 
            transition: 0.15s; 
            letter-spacing: 0.5px; 
        }
        .mall-header .mall-invite-btn:active { background: rgba(0,0,0,0.04); }
        .mall-header .mall-invite-btn.inviting { background: rgba(0,0,0,0.04); color: var(--text-primary); }

        .mall-search-wrap { padding: 6px 0 12px; flex-shrink: 0; }
        .mall-search-wrap input { 
            width: 100%; 
            padding: 8px 14px; 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            font-size: 11px; 
            background: var(--bg-input); 
            color: var(--text-primary); 
            outline: none; 
            font-family: inherit; 
            transition: 0.2s; 
            letter-spacing: 0.3px; 
        }
        .mall-search-wrap input::placeholder { color: var(--text-light); font-weight: 300; }
        .mall-search-wrap input:focus { border-color: var(--accent-soft); background: #f8f6f3; }

        .mall-categories { 
            display: flex; 
            gap: 16px; 
            padding: 0 0 12px; 
            overflow-x: auto; 
            flex-shrink: 0; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
        }
        .mall-categories::-webkit-scrollbar { display: none; }
        .mall-categories .cat-btn { 
            background: none; 
            border: none; 
            font-size: 11px; 
            color: var(--text-secondary); 
            cursor: pointer; 
            padding: 2px 0; 
            font-family: inherit; 
            letter-spacing: 1px; 
            font-weight: 300; 
            transition: 0.2s; 
            white-space: nowrap; 
            border-bottom: 1px solid transparent; 
        }
        .mall-categories .cat-btn.active { color: var(--text-primary); border-bottom-color: var(--accent-soft); }
        .mall-categories .cat-btn:active { opacity: 0.5; }

        .mall-body { flex: 1; overflow-y: auto; padding: 0 0 12px; position: relative; }
        .mall-product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .mall-product-card { 
            background: var(--bg-card); 
            border-radius: 16px; 
            padding: 0 0 10px; 
            box-shadow: 0 1px 6px var(--shadow); 
            transition: 0.25s; 
            display: flex; 
            flex-direction: column; 
            cursor: pointer; 
            position: relative; 
            overflow: hidden; 
        }
        .mall-product-card:active { transform: scale(0.97); }
        .mall-product-card .product-img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            background: #f0eeeb; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            color: var(--text-light); 
            overflow: hidden; 
            border-radius: 16px 16px 0 0; 
        }
        .mall-product-card .product-img img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: saturate(0.6) contrast(0.9) brightness(1.02); 
            transition: 0.4s; 
        }
        .mall-product-card:hover .product-img img { filter: saturate(0.7) contrast(0.95); }
        .mall-product-card .product-info { padding: 8px 12px 4px; }
        .mall-product-card .product-name { 
            font-size: 12px; 
            font-weight: 300; 
            color: var(--text-primary); 
            letter-spacing: 0.3px; 
            line-height: 1.5; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        .mall-product-card .product-price { 
            font-size: 13px; 
            font-weight: 300; 
            color: var(--text-secondary); 
            margin-top: 2px; 
            letter-spacing: 0.5px; 
        }
        .mall-product-card .product-tag { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            font-size: 8px; 
            color: #fff; 
            background: rgba(0,0,0,0.15); 
            padding: 2px 10px; 
            border-radius: 20px; 
            font-weight: 300; 
            letter-spacing: 0.5px; 
            backdrop-filter: blur(4px); 
        }
        .mall-product-card .product-tag.hot { background: rgba(0,0,0,0.12); }
        .mall-product-card .product-tag.new { background: rgba(0,0,0,0.08); }
        .mall-product-card .product-tag.couple { background: rgba(0,0,0,0.10); }
        .mall-product-card .product-tag.default-tag { background: rgba(0,0,0,0.06); }

        .mall-empty { text-align: center; padding: 60px 20px; color: var(--text-light); grid-column: 1 / -1; }
        .mall-empty i { font-size: 32px; opacity: 0.3; display: block; margin-bottom: 10px; }

        .mall-bottom-nav { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 8px 0 12px; 
            border-top: 1px solid var(--border); 
            flex-shrink: 0; 
            background: var(--bg); 
        }
        .mall-bottom-nav .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            background: none; 
            border: none; 
            color: var(--text-light); 
            font-size: 16px; 
            cursor: pointer; 
            font-family: inherit; 
            transition: 0.2s; 
            padding: 4px 12px; 
        }
        .mall-bottom-nav .nav-item span { font-size: 8px; letter-spacing: 1px; font-weight: 300; }
        .mall-bottom-nav .nav-item.active { color: var(--text-secondary); }
        .mall-bottom-nav .nav-item:active { opacity: 0.5; }

        .mall-order-entry { 
            margin: 10px 0 0; 
            padding: 10px 0; 
            border-top: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: 0.15s; 
            font-size: 11px; 
            color: var(--text-secondary); 
            letter-spacing: 0.5px; 
        }
        .mall-order-entry:active { opacity: 0.5; }
        .mall-order-entry i { color: var(--text-light); font-size: 13px; }

        /* ===== 弹窗 ===== */
        .mall-detail-overlay { 
            position: absolute; inset: 0; z-index: 30; background: var(--bg); 
            display: none; flex-direction: column; animation: fadeInUp 0.3s ease; 
            border-radius: 28px; overflow: hidden; padding: 12px 14px 0; 
        }
        .mall-detail-overlay.active { display: flex; }
        .mall-detail-header { 
            display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; 
            flex-shrink: 0; border-bottom: 1px solid var(--border); 
        }
        .mall-detail-header .back-btn { 
            font-size: 18px; color: var(--text-secondary); cursor: pointer; 
            border: none; background: none; padding: 4px; 
        }
        .mall-detail-header .title { 
            font-size: 13px; font-weight: 300; color: var(--text-secondary); 
            letter-spacing: 2px; flex: 1; 
        }
        .mall-detail-body { flex: 1; overflow-y: auto; padding: 16px 0; }
        .mall-detail-body .detail-img { 
            width: 100%; aspect-ratio: 1/1; border-radius: 16px; background: #f0eeeb; 
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
            font-size: 48px; color: var(--text-light); margin-bottom: 14px; 
        }
        .mall-detail-body .detail-img img { 
            width: 100%; height: 100%; object-fit: cover; filter: saturate(0.6) contrast(0.9); 
        }
        .mall-detail-body .detail-name { 
            font-size: 16px; font-weight: 300; color: var(--text-primary); letter-spacing: 1px; 
        }
        .mall-detail-body .detail-price { 
            font-size: 18px; font-weight: 300; color: var(--text-secondary); margin: 4px 0 12px; 
        }
        .mall-detail-body .detail-desc { 
            font-size: 12px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 14px; 
            padding: 12px 14px; background: var(--bg-card); border-radius: 12px; 
            border: 1px solid var(--border); font-weight: 300; 
        }
        .mall-detail-body .detail-qty { 
            display: flex; align-items: center; gap: 12px; margin-bottom: 12px; 
        }
        .mall-detail-body .detail-qty label { font-size: 11px; font-weight: 300; color: var(--text-secondary); }
        .mall-detail-body .detail-qty .qty-btn { 
            width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); 
            background: var(--bg-card); font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; color: var(--text-secondary); 
        }
        .mall-detail-body .detail-qty .qty-btn:active { transform: scale(0.92); }
        .mall-detail-body .detail-qty .qty-num { 
            font-size: 15px; font-weight: 300; color: var(--text-primary); min-width: 28px; text-align: center; 
        }
        .mall-detail-body .detail-note input { 
            width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; 
            font-size: 11px; background: var(--bg-input); color: var(--text-primary); 
            outline: none; font-family: inherit; font-weight: 300; 
        }
        .mall-detail-body .detail-note input:focus { border-color: var(--accent-soft); }
        .mall-detail-footer { 
            display: flex; gap: 10px; padding: 12px 0 16px; border-top: 1px solid var(--border); 
            flex-shrink: 0; 
        }
        .mall-detail-footer button { 
            flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 24px; 
            font-size: 11px; font-weight: 300; cursor: pointer; transition: 0.15s; 
            font-family: inherit; letter-spacing: 1px; background: var(--bg-card); color: var(--text-secondary); 
        }
        .mall-detail-footer button:active { transform: scale(0.97); background: var(--bg-input); }
        .mall-detail-footer .btn-gift { background: var(--bg-input); color: var(--text-primary); }
        .mall-detail-footer .btn-gift:disabled { opacity: 0.3; cursor: not-allowed; }
        .mall-detail-footer .btn-buy { background: var(--bg-card); color: var(--text-primary); }

        .cart-overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.15); 
            backdrop-filter: blur(2px); z-index: 40; display: none; justify-content: flex-end; 
            border-radius: 28px; overflow: hidden; 
        }
        .cart-overlay.active { display: flex; }
        .cart-drawer { 
            background: var(--bg); width: 88%; max-width: 320px; height: 100%; 
            padding: 20px 18px 24px; overflow-y: auto; 
            box-shadow: -4px 0 24px rgba(0,0,0,0.02); animation: slideInRight 0.25s ease; 
            display: flex; flex-direction: column; 
        }
        .cart-drawer .cart-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; 
        }
        .cart-drawer .cart-header h3 { 
            font-size: 14px; font-weight: 300; color: var(--text-primary); letter-spacing: 2px; 
        }
        .cart-drawer .cart-header .close-cart { 
            font-size: 20px; color: var(--text-light); cursor: pointer; background: none; border: none; 
        }
        .cart-drawer .cart-list { flex: 1; overflow-y: auto; padding: 12px 0; }
        .cart-drawer .cart-empty { text-align: center; padding: 40px 0; color: var(--text-light); }
        .cart-drawer .cart-empty i { font-size: 28px; opacity: 0.3; display: block; margin-bottom: 8px; }
        .cart-item { 
            display: flex; align-items: center; gap: 12px; padding: 10px 0; 
            border-bottom: 1px solid var(--border); 
        }
        .cart-item .ci-img { 
            width: 40px; height: 40px; border-radius: 8px; background: var(--bg-input); 
            display: flex; align-items: center; justify-content: center; font-size: 18px; 
            flex-shrink: 0; overflow: hidden; 
        }
        .cart-item .ci-img img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.5); }
        .cart-item .ci-info { flex: 1; }
        .cart-item .ci-info .ci-name { font-size: 12px; color: var(--text-primary); font-weight: 300; }
        .cart-item .ci-info .ci-price { font-size: 11px; color: var(--text-secondary); font-weight: 300; }
        .cart-item .ci-qty { display: flex; align-items: center; gap: 6px; }
        .cart-item .ci-qty button { 
            width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); 
            background: var(--bg-card); cursor: pointer; font-size: 12px; 
            display: flex; align-items: center; justify-content: center; color: var(--text-secondary); 
        }
        .cart-item .ci-qty button:active { transform: scale(0.92); }
        .cart-item .ci-qty .qty-num { 
            font-size: 12px; font-weight: 300; color: var(--text-primary); min-width: 20px; text-align: center; 
        }
        .cart-item .ci-remove { color: var(--text-light); cursor: pointer; font-size: 13px; background: none; border: none; padding: 4px; }
        .cart-footer { border-top: 1px solid var(--border); padding-top: 14px; flex-shrink: 0; }
        .cart-footer .total-row { 
            display: flex; justify-content: space-between; font-size: 13px; font-weight: 300; 
            color: var(--text-primary); margin-bottom: 4px; 
        }
        .cart-footer .total-row .total-price { color: var(--text-secondary); }
        .cart-footer .balance-row { 
            display: flex; justify-content: space-between; font-size: 11px; 
            color: var(--text-light); margin-bottom: 10px; 
        }
        .cart-footer .balance-row .balance-amount { color: var(--text-secondary); }
        .cart-footer .balance-row .balance-amount.insufficient { color: #c5b8b0; }
        .cart-footer .checkout-btn { 
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 24px; 
            background: var(--bg-card); color: var(--text-secondary); font-size: 12px; 
            font-weight: 300; cursor: pointer; transition: 0.15s; font-family: inherit; 
            letter-spacing: 1px; 
        }
        .cart-footer .checkout-btn:active { transform: scale(0.97); background: var(--bg-input); }
        .cart-footer .checkout-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .mall-recharge-overlay { 
            position: absolute; inset: 0; z-index: 35; background: rgba(0,0,0,0.12); 
            backdrop-filter: blur(2px); display: none; justify-content: center; 
            align-items: center; border-radius: 28px; overflow: hidden; 
        }
        .mall-recharge-overlay.active { display: flex; }
        .mall-recharge-panel { 
            background: var(--bg); border-radius: 20px; padding: 24px 20px 20px; 
            max-width: 300px; width: 90%; animation: fadeInUp 0.3s ease; text-align: center; 
        }
        .mall-recharge-panel h3 { font-size: 15px; font-weight: 300; color: var(--text-primary); letter-spacing: 2px; }
        .mall-recharge-panel p { font-size: 11px; color: var(--text-light); margin-bottom: 12px; }
        .mall-recharge-panel .recharge-input { 
            width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; 
            font-size: 16px; text-align: center; outline: none; background: var(--bg-input); 
            color: var(--text-primary); font-weight: 300; 
        }
        .mall-recharge-panel .recharge-input:focus { border-color: var(--accent-soft); }
        .mall-recharge-panel .recharge-btns { 
            display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; justify-content: center; 
        }
        .mall-recharge-panel .recharge-btns button { 
            padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; 
            background: var(--bg-card); font-size: 11px; cursor: pointer; 
            font-family: inherit; color: var(--text-secondary); transition: 0.15s; 
        }
        .mall-recharge-panel .recharge-btns button:active { transform: scale(0.95); background: var(--bg-input); }
        .mall-recharge-panel .recharge-btns button .r-amount { color: var(--text-primary); }
        .mall-recharge-panel .recharge-confirm { 
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 24px; 
            background: var(--bg-card); color: var(--text-secondary); font-size: 12px; 
            font-weight: 300; cursor: pointer; font-family: inherit; letter-spacing: 1px; 
            transition: 0.15s; 
        }
        .mall-recharge-panel .recharge-confirm:active { transform: scale(0.97); background: var(--bg-input); }
        .mall-recharge-panel .recharge-cancel { 
            background: none; border: none; color: var(--text-light); font-size: 11px; 
            cursor: pointer; margin-top: 8px; font-family: inherit; 
        }

        .mall-role-select-overlay { 
            position: absolute; inset: 0; z-index: 36; background: rgba(0,0,0,0.12); 
            backdrop-filter: blur(2px); display: none; justify-content: center; 
            align-items: center; border-radius: 28px; overflow: hidden; 
        }
        .mall-role-select-overlay.active { display: flex; }
        .mall-role-select-panel { 
            background: var(--bg); border-radius: 20px; padding: 20px 20px 24px; 
            max-width: 280px; width: 90%; animation: fadeInUp 0.3s ease; text-align: center; 
        }
        .mall-role-select-panel h3 { font-size: 14px; font-weight: 300; color: var(--text-primary); letter-spacing: 2px; }
        .mall-role-select-panel p { font-size: 11px; color: var(--text-light); margin-bottom: 12px; }
        .mall-role-select-panel .role-select-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .mall-role-select-panel .role-select-btn { 
            display: flex; align-items: center; gap: 10px; padding: 8px 12px; 
            border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); 
            cursor: pointer; font-family: inherit; width: 100%; text-align: left; 
            transition: 0.15s; 
        }
        .mall-role-select-panel .role-select-btn .rs-avatar { 
            width: 32px; height: 32px; border-radius: 50%; background-color: var(--bg-input); 
            background-size: cover; background-position: center; flex-shrink: 0; 
        }
        .mall-role-select-panel .role-select-btn .rs-name { 
            flex: 1; font-size: 13px; font-weight: 300; color: var(--text-primary); 
        }
        .mall-role-select-panel .role-select-btn .rs-check { color: var(--text-light); font-size: 16px; }
        .mall-role-select-panel .role-select-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .mall-role-select-panel .role-select-cancel { 
            width: 100%; padding: 8px; border: none; border-radius: 20px; 
            background: var(--bg-input); color: var(--text-light); font-size: 11px; 
            cursor: pointer; font-family: inherit; 
        }

        /* ===== 商城陪逛聊天窗口 ===== */
        .shopping-chat-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.04);
            border-radius: 20px 20px 0 0;
            max-height: 50%;
            display: none;
            flex-direction: column;

<script>
// ============================================================
//  🛍️ 街角商店 · 完整版（含陪逛聊天）
// ============================================================

// ===== 配置 =====
var MALL_CONFIG = {
    initialBalance: 1000,
    cooldownMinutes: 60,
    maxRejectCount: 5,
    spotProbability: 0.30,
    heartSpikeOnGift: 15,
    heartSpikeOnAiGift: 10,
};

// ===== 全局变量 =====
var mallProducts = [];
var mallCart = [];
var mallOrders = [];
var mallBalance = MALL_CONFIG.initialBalance;
var mallRechargeHistory = [];
var mallAiGiftReceived = [];
var mallShoppingTogether = {
    roleId: null,
    roleName: '',
    roleData: null,
    rejectCount: 0,
    totalTriggers: 0,
    cooldownUntil: null,
    isActive: false,
    pendingProduct: null,
};
var mallRoles = [];
var currentDetailProduct = null;
var lastTriggeredProductId = null;
var pendingAiGiftOrder = null;
var currentCategory = 'all';
var searchQuery = '';

// ===== 陪逛聊天变量 =====
var scMessages = [];
var scCurrentRole = null;
var scPendingProduct = null;
var scIsProcessing = false;

// ===== 工具函数 =====
function generateId() {
    return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
}

function showToast(msg) {
    var old = document.querySelector('.custom-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'custom-toast';
    toast.textContent = msg;
    document.querySelector('.phone-frame').appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2500);
}

// ===== 读取主应用数据 =====
function loadRolesFromMain() {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            mallRoles = data.roles || [];
            return mallRoles;
        }
    } catch (_) {}
    return [];
}

function getCurrentRoleFromMain() {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            var currentId = data.currentRoleId;
            if (currentId) {
                return data.roles.find(function(r) { return r.id === currentId; }) || data.roles[0] || null;
            }
            return data.roles[0] || null;
        }
    } catch (_) {}
    return null;
}

function getApiKeyFromMain() {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            return data.config && data.config.apiKey ? data.config.apiKey : '';
        }
    } catch (_) {}
    return '';
}

function getModelFromMain() {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            return data.config && data.config.model ? data.config.model : 'deepseek-chat';
        }
    } catch (_) {}
    return 'deepseek-chat';
}

function getRoleById(roleId) {
    return mallRoles.find(function(r) { return r.id === roleId; }) || null;
}

// ===== 读写商城数据（存到主应用的 ds_multirole_v2 中） =====
function loadMallData() {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            if (data.mall) {
                mallBalance = data.mall.balance !== undefined ? data.mall.balance : MALL_CONFIG.initialBalance;
                mallCart = data.mall.cart || [];
                mallOrders = data.mall.orders || [];
                mallRechargeHistory = data.mall.rechargeHistory || [];
                mallAiGiftReceived = data.mall.aiGiftReceived || [];
                if (data.mall.shoppingTogether) {
                    Object.assign(mallShoppingTogether, data.mall.shoppingTogether);
                    if (mallShoppingTogether.roleId) {
                        var roles = loadRolesFromMain();
                        var role = roles.find(function(r) { return r.id === mallShoppingTogether.roleId; });
                        if (role) {
                            mallShoppingTogether.roleData = role;
                            mallShoppingTogether.roleName = role.name;
                        } else {
                            mallShoppingTogether.isActive = false;
                            mallShoppingTogether.roleId = null;
                            mallShoppingTogether.roleName = '';
                            mallShoppingTogether.roleData = null;
                        }
                    }
                }
                return;
            }
        }
    } catch (_) {}
    mallBalance = MALL_CONFIG.initialBalance;
    mallCart = [];
    mallOrders = [];
    mallRechargeHistory = [];
    mallAiGiftReceived = [];
}

function saveMallData() {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        var data = raw ? JSON.parse(raw) : {};
        if (!data.mall) data.mall = {};
        data.mall.balance = mallBalance;
        data.mall.cart = mallCart;
        data.mall.orders = mallOrders;
        data.mall.rechargeHistory = mallRechargeHistory;
        data.mall.aiGiftReceived = mallAiGiftReceived;
        data.mall.shoppingTogether = {
            roleId: mallShoppingTogether.roleId,
            roleName: mallShoppingTogether.roleName,
            rejectCount: mallShoppingTogether.rejectCount,
            totalTriggers: mallShoppingTogether.totalTriggers,
            cooldownUntil: mallShoppingTogether.cooldownUntil,
            isActive: mallShoppingTogether.isActive,
            pendingProduct: mallShoppingTogether.pendingProduct,
        };
        localStorage.setItem('ds_multirole_v2', JSON.stringify(data));
    } catch (_) {}
}

// ===== 更新主应用心跳和记忆 =====
function saveHeartDataToMain(roleId, heartData) {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            var role = data.roles.find(function(r) { return r.id === roleId; });
            if (role) {
                if (!role.heartData) role.heartData = {};
                role.heartData.value = heartData.value || 65;
                role.heartData.peakValue = heartData.peakValue || 65;
                role.heartData.restingValue = heartData.restingValue || 65;
                role.heartData.recentTrigger = heartData.recentTrigger || '收到礼物 💕';
                if (heartData.signature) role.heartData.signature = heartData.signature;
                localStorage.setItem('ds_multirole_v2', JSON.stringify(data));
                return true;
            }
        }
    } catch (_) {}
    return false;
}

function addMemoryToMain(roleId, text) {
    try {
        var raw = localStorage.getItem('ds_multirole_v2');
        if (raw) {
            var data = JSON.parse(raw);
            var role = data.roles.find(function(r) { return r.id === roleId; });
            if (role) {
                if (!Array.isArray(role.memory)) role.memory = [];
                var exists = role.memory.some(function(m) {
                    return m.text && m.text.indexOf(text.substring(0, 10)) !== -1;
                });
                if (!exists) {
                    role.memory.push({ text: text, sourceMessageId: 'gift_' + Date.now() });
                    localStorage.setItem('ds_multirole_v2', JSON.stringify(data));
                    return true;
                }
            }
        }
    } catch (_) {}
    return false;
}

            { id: 'default_3', name: '情侣拖鞋', price: 49, image: '', description: 'EVA材质，防滑耐磨', tag: '情侣' },

function renderMallProducts() {
    var grid = document.getElementById('mallProductGrid');
    if (!grid) return;

    var filtered = mallProducts.filter(function(p) {
        var matchCategory = currentCategory === 'all' || (p.tag && p.tag === currentCategory);
        var matchSearch = !searchQuery || p.name.includes(searchQuery) || (p.description && p.description.includes(searchQuery));
        return matchCategory && matchSearch;
    });

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="mall-empty"><i class="fas fa-box-open"></i><p>没有找到商品</p></div>';
        return;
    }

    var html = '';
    filtered.forEach(function(p) {
        var tagHtml = p.tag ? '<span class="product-tag ' + getTagClass(p.tag) + '">' + p.tag + '</span>' : '';
        var imgHtml = p.image ? '<img src="' + p.image + '" alt="' + p.name + '" loading="lazy" />' : '☕';
        html += '<div class="mall-product-card" data-id="' + p.id + '">' + tagHtml + 
            '<div class="product-img">' + imgHtml + '</div>' +
            '<div class="product-info"><div class="product-name">' + p.name + '</div><div class="product-price">¥' + p.price + '</div></div>' +
            '</div>';
    });
    grid.innerHTML = html;

    grid.querySelectorAll('.mall-product-card').forEach(function(el) {
        el.addEventListener('click', function() {
            var product = mallProducts.find(function(p) { return p.id === el.dataset.id; });
            if (product) openMallDetail(product);
        });
    });
    updateOrderCount();
}

function getTagClass(tag) {
    var map = { '生活': 'default', '家居': 'default', '情侣': 'couple', '外卖': 'default' };
    return map[tag] || 'default-tag';
}

function updateOrderCount() {
    var badge = document.getElementById('orderCountBadge');
    if (badge) badge.textContent = '(' + mallOrders.length + ')';
}

// ===== 购买 / 送礼（可角色选择） =====
function purchaseProduct(product, qty, note, mode) {
    var totalPrice = product.price * qty;
    
    // 送礼模式：弹窗选择角色
    if (mode === 'gift') {
        selectTargetRoleForGift(function(selectedRole) {
            if (!selectedRole) return;
            if (mallBalance < totalPrice) { showToast('💰 余额不足，去充值吧～'); return; }
            if (!confirm('💝 送给 ' + selectedRole.name + '「' + product.name + '」×' + qty + ' 吗？\n花费 ¥' + totalPrice)) return;
            
            executePurchase(product, qty, note, mode, selectedRole, totalPrice);
        });
        return;
    }
    
    // 购买模式：使用当前角色
    var currentRole = getCurrentRoleFromMain();
    if (!currentRole) { showToast('⚠️ 请先在主应用中创建角色'); return; }
    if (mallBalance < totalPrice) { showToast('💰 余额不足，去充值吧～'); return; }
    if (!confirm('购买「' + product.name + '」×' + qty + ' 吗？\n花费 ¥' + totalPrice)) return;
    
    executePurchase(product, qty, note, mode, currentRole, totalPrice);
}

// ===== 执行购买 =====
function executePurchase(product, qty, note, mode, targetRole, totalPrice) {
    mallBalance -= totalPrice;
    var order = {
        id: 'ORD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        productId: product.id, productName: product.name, productImage: product.image,
        price: product.price, qty: qty, total: totalPrice,
        note: note || '', mode: mode,
        roleName: targetRole.name, roleId: targetRole.id,
        status: 'pending', giftFromAi: false,
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    };
    mallOrders.push(order);
    saveMallData();
    document.getElementById('mallDetailOverlay').classList.remove('active');
    updateMallUI();
    showToast('✅ ' + (mode === 'gift' ? '🎁 已送给 ' + targetRole.name : '购买成功'));

    if (mode === 'gift') {
        triggerHeartSpikeForGift(targetRole, product, 'gift');
        addGiftToMemory(targetRole, product, 'user', note);
        triggerGiftChatReply(targetRole, product, note);
    }
}

// ===== 选择送礼目标角色 =====
function selectTargetRoleForGift(callback) {
    var roles = loadRolesFromMain();
    if (roles.length === 0) {
        showToast('⚠️ 暂无角色，请先创建');
        callback(null);
        return;
    }
    
    // 如果只有一个角色，直接选择
    if (roles.length === 1) {
        callback(roles[0]);
        return;
    }
    
    // 多个角色：弹窗选择
    var overlay = document.getElementById('mallRoleSelectOverlay');
    var list = document.getElementById('mallRoleSelectList');
    
    var html = '';
    roles.forEach(function(role) {
        var avatarStyle = role.avatar && role.avatar.startsWith('data:') 
            ? 'background-image:url(' + role.avatar + ');background-size:cover;background-position:center;' 
            : 'background-color:#d6d0c8;';
        var intimacy = role.extendedState && role.extendedState.intimacy ? role.extendedState.intimacy : 0;
        var intimacyText = intimacy > 0 ? ' 💕' + intimacy + '%' : '';
        html += '<button class="role-select-btn" data-id="' + role.id + '">' +
            '<div class="rs-avatar" style="' + avatarStyle + '"></div>' +
            '<span class="rs-name">' + role.name + intimacyText + '</span>' +
            '<span class="rs-check">💝</span>' +
            '</button>';
    });
    list.innerHTML = html;
    
    overlay.classList.add('active');
    
    list.querySelectorAll('.role-select-btn').forEach(function(btn) {
        btn.onclick = function() {
            overlay.classList.remove('active');
            var role = roles.find(function(r) { return r.id === btn.dataset.id; });
            callback(role);
        };
    });
    
    // 取消按钮
    var cancelBtn = document.getElementById('mallRoleSelectCancel');
    if (cancelBtn) {
        cancelBtn.onclick = function() {
            overlay.classList.remove('active');
            callback(null);
        };
    }
}

// ===== 礼物触发心跳 + 记忆 + AI 回复 =====
function triggerHeartSpikeForGift(role, product, mode) {
    if (!role) return;
    var spikeAmount = mode === 'gift' ? MALL_CONFIG.heartSpikeOnGift : MALL_CONFIG.heartSpikeOnAiGift;
    var newValue = 65 + spikeAmount + Math.floor(Math.random() * 10);
    var heartData = {
        value: Math.min(99, newValue),
        peakValue: Math.min(99, newValue),
        restingValue: 65,
        recentTrigger: '💝 收到了「' + product.name + '」',
    };
    saveHeartDataToMain(role.id, heartData);
    showToast('💓 心跳飙升 +' + spikeAmount + '！');
}

function addGiftToMemory(role, product, from, note) {
    if (!role) return;
    var giftText = from === 'user' 
        ? '💝 我送了「' + product.name + '」给 ' + role.name + (note ? '（附言：' + note + '）' : '')
        : '🎁 ' + role.name + ' 送了我「' + product.name + '」' + (note ? '（附言：' + note + '）' : '');
    addMemoryToMain(role.id, giftText);
}

function triggerGiftChatReply(role, product, note) {
    var apiKey = getApiKeyFromMain();
    if (!apiKey) {
        var fallbackReplies = ['哇！谢谢你送的礼物！我太开心了 💕', '你真好，这个礼物我好喜欢！', '天哪，你居然送我这个！我好感动 😭', '谢谢你的心意，我会好好珍惜的 💝'];
        var reply = fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
        showToast('💬 ' + role.name + '：' + reply);
        return;
    }
    var model = getModelFromMain();
    var systemPrompt = '你正在扮演「' + role.name + '」。用户刚刚送了你一份礼物，请根据你的性格回应。\n角色人设：' + (role.persona || '温柔体贴') + '\n说话风格：' + (role.style || '温柔细腻') + '\n要求：用第一人称「我」说话，表达真实感受，控制在2-4句话。';
    var giftMessage = '用户送给你：' + product.name + (note ? '（附言：' + note + '）' : '');
    fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
            model: model,
            messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: giftMessage }],
            temperature: 0.85,
            max_tokens: 200,
        }),
    }).then(function(resp) {
        if (!resp.ok) throw new Error('API 错误');
        return resp.json();
    }).then(function(data) {
        var reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (reply) {
            showToast('💬 ' + role.name + '：' + reply.substring(0, 50) + (reply.length > 50 ? '...' : ''));
        }
    }).catch(function(e) {
        console.log('送礼回复失败:', e);
    });
}

// ===== 购物车 =====
function addToCart(product, qty) {
    var existing = mallCart.find(function(item) { return item.id === product.id; });
    if (existing) { existing.qty += qty; }
    else { mallCart.push({ id: product.id, name: product.name, price: product.price, image: product.image, qty: qty }); }
    saveMallData();
    updateMallUI();
    showToast('🛒 已加入购物袋：' + product.name + ' ×' + qty);
}

function removeFromCart(productId) {
    mallCart = mallCart.filter(function(item) { return item.id !== productId; });
    saveMallData();
    updateMallUI();
    renderCart();
}

function updateCartQty(productId, delta) {
    var item = mallCart.find(function(i) { return i.id === productId; });
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) { removeFromCart(productId); return; }
    saveMallData();
    updateMallUI();
    renderCart();
}

function renderCart() {
    var list = document.getElementById('cartList');
    var totalEl = document.getElementById('cartTotalPrice');
    var balanceEl = document.getElementById('cartBalanceDisplay');
    var checkoutBtn = document.getElementById('cartCheckoutBtn');

    if (mallCart.length === 0) {
        list.innerHTML = '<div class="cart-empty"><i class="fas fa-shopping-bag"></i><p>购物袋是空的</p></div>';
        totalEl.textContent = '¥0';
        balanceEl.textContent = '¥' + mallBalance;
        checkoutBtn.disabled = true;
        return;
    }

    var html = '', total = 0;
    mallCart.forEach(function(item) {
        var subtotal = item.price * item.qty;
        total += subtotal;
        var imgHtml = item.image ? '<img src="' + item.image + '" alt="' + item.name + '" />' : '☕';
        html += '<div class="cart-item"><div class="ci-img">' + imgHtml + '</div><div class="ci-info"><div class="ci-name">' + item.name + '</div><div class="ci-price">¥' + item.price + '</div></div><div class="ci-qty"><button class="ci-qty-btn" data-id="' + item.id + '" data-delta="-1">−</button><span class="qty-num">' + item.qty + '</span><button class="ci-qty-btn" data-id="' + item.id + '" data-delta="1">+</button></div><button class="ci-remove" data-id="' + item.id + '"><i class="fas fa-trash-alt"></i></button></div>';
    });
    list.innerHTML = html;
    totalEl.textContent = '¥' + total;
    balanceEl.textContent = '¥' + mallBalance;
    checkoutBtn.disabled = mallBalance < total;
    checkoutBtn.textContent = mallBalance < total ? '余额不足' : '结算';

    list.querySelectorAll('.ci-qty-btn').forEach(function(btn) {
        btn.onclick = function() { updateCartQty(btn.dataset.id, parseInt(btn.dataset.delta)); };
    });
    list.querySelectorAll('.ci-remove').forEach(function(btn) {
        btn.onclick = function() { removeFromCart(btn.dataset.id); };
    });
    checkoutBtn.onclick = checkoutCart;
}

function checkoutCart() {
    if (mallCart.length === 0) return;
    var total = mallCart.reduce(function(sum, item) { return sum + item.price * item.qty; }, 0);
    if (mallBalance < total) { showToast('余额不足'); return; }
    if (!confirm('结算购物袋？\n共 ' + mallCart.length + ' 件\n总计 ¥' + total)) return;
    mallBalance -= total;
    var role = getCurrentRoleFromMain();
    var order = {
        id: 'ORD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        items: mallCart.map(function(item) { return { productId: item.id, productName: item.name, productImage: item.image, price: item.price, qty: item.qty }; }),
        total: total,
        roleName: role ? role.name : 'TA',
        roleId: role ? role.id : null,
        status: 'pending',
        giftFromAi: false,
        note: '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
    };
    mallOrders.push(order);
    mallCart = [];
    saveMallData();
    closeCart();
    updateMallUI();
    showToast('✅ 下单成功');
}

function openCart() {
    document.getElementById('cartOverlay').classList.add('active');
    renderCart();
}
function closeCart() {
    document.getElementById('cartOverlay').classList.remove('active');
}

// ===== 订单列表 =====
function showOrderList() {
    var body = document.getElementById('mallBody');
    if (!body) return;
    var html = '<div style="margin-bottom:12px;"><button class="meme-back-btn" id="orderBackBtn" style="background:none;border:none;color:#576b95;font-size:14px;cursor:pointer;padding:4px 8px;display:flex;align-items:center;gap:4px;"><i class="fas fa-arrow-left"></i> 返回商城</button></div>';
    html += '<div class="mall-order-list">';
    if (mallOrders.length === 0) {
        html += '<div class="mall-empty"><i class="fas fa-inbox"></i><p>暂无订单</p></div>';
    } else {
        var sortedOrders = mallOrders.slice().sort(function(a, b) {
            return new Date(b.createdAt) - new Date(a.createdAt);
        });
        sortedOrders.forEach(function(order) {
            var statusMap = { 'pending': '待发货', 'shipped': '已发货', 'done': '已完成' };
            var statusClass = { 'pending': 'status-pending', 'shipped': 'status-shipped', 'done': 'status-done' };
            var itemsText = order.items ? order.items.map(function(item) {
                return item.productName + ' ×' + item.qty;
            }).join('、') : order.productName + ' ×' + order.qty;
            var giftTag = order.giftFromAi ? ' <span class="oi-gift-tag">🎁 来自 ' + order.roleName + ' 的礼物</span>' : '';
            var modeTag = order.mode === 'gift' ? ' 💝 送礼' : ' 🛒 购买';
            html += '<div class="mall-order-item"><div class="order-header"><span class="order-id">' + order.id + '</span><span class="order-time">' + new Date(order.createdAt).toLocaleString() + '</span></div><div class="order-items">' + itemsText + giftTag + modeTag + '</div><div class="order-total">¥' + order.total + '</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;"><span class="order-status ' + (statusClass[order.status] || 'status-pending') + '">' + (statusMap[order.status] || '待发货') + '</span><div class="order-actions">' + (order.status === 'pending' && !order.giftFromAi ? '<button class="btn-refund" data-id="' + order.id + '">退款</button>' : '') + (order.status === 'pending' ? '<button class="btn-ship" data-id="' + order.id + '">发货</button>' : '') + (order.status === 'shipped' ? '<button class="btn-done" data-id="' + order.id + '">确认收货</button>' : '') + '<button class="btn-delete-order" data-id="' + order.id + '">删除</button></div></div></div>';
        });
    }
    html += '</div>';
    body.innerHTML = html;

    document.getElementById('orderBackBtn').addEventListener('click', function() {
        renderMallProducts();
        updateOrderCount();
        var entry = document.getElementById('mallOrderEntry');
        if (entry) entry.style.display = 'flex';
    });

    body.querySelectorAll('.btn-refund').forEach(function(btn) {
        btn.onclick = function() { cancelOrderAndRefund(btn.dataset.id); };
    });
    body.querySelectorAll('.btn-ship').forEach(function(btn) {
        btn.onclick = function() {
            var order = mallOrders.find(function(o) { return o.id === btn.dataset.id; });
            if (order) { order.status = 'shipped'; order.updatedAt = new Date().toISOString(); saveMallData(); showOrderList(); showToast('🚚 已发货'); }
        };
    });
    body.querySelectorAll('.btn-done').forEach(function(btn) {
        btn.onclick = function() {
            var order = mallOrders.find(function(o) { return o.id === btn.dataset.id; });
            if (order) { order.status = 'done'; order.updatedAt = new Date().toISOString(); saveMallData(); showOrderList(); showToast('✅ 已确认收货'); }
        };
    });
    body.querySelectorAll('.btn-delete-order').forEach(function(btn) {
        btn.onclick = function() {
            if (confirm('确定要删除此订单吗？')) {
                mallOrders = mallOrders.filter(function(o) { return o.id !== btn.dataset.id; });
                saveMallData();
                showOrderList();
                showToast('🗑️ 已删除订单');
            }
        };
    });
}

function cancelOrderAndRefund(orderId) {
    var order = mallOrders.find(function(o) { return o.id === orderId; });
    if (!order) { showToast('⚠️ 未找到该订单'); return; }
    if (order.status !== 'pending') { showToast('⚠️ 只有待发货的订单可以退款'); return; }
    if (order.giftFromAi) { showToast('⚠️ AI 赠送的礼物不能退款'); return; }
    if (confirm('确定要取消订单「' + order.productName + '」并退款 ¥' + order.total + ' 吗？')) {
        mallBalance += order.total;
        mallOrders = mallOrders.filter(function(o) { return o.id !== orderId; });
        saveMallData();
        updateMallUI();
        showToast('✅ 已退款 ¥' + order.total);
        showOrderList();
    }
}

// ===== UI 更新 =====
function updateMallUI() {
    var el = document.getElementById('mallBalanceAmount');
    if (el) el.textContent = mallBalance;
    var count = mallCart.reduce(function(sum, item) { return sum + item.qty; }, 0);
    var badge = document.getElementById('mallCartCount');
    if (badge) {
        if (count > 0) { badge.textContent = count > 99 ? '99+' : count; badge.classList.remove('empty'); }
        else { badge.classList.add('empty'); }
    }
    updateOrderCount();
    saveMallData();
}

    document.getElementById('scRoleName').textContent = role.name;
    
    addScMessage('assistant', '和你一起逛好开心 💕 看到喜欢的告诉我～');
    
    document.getElementById('shoppingChatOverlay').classList.add('active');
    document.getElementById('scInput').focus();
}

function closeShoppingChat() {
    document.getElementById('shoppingChatOverlay').classList.remove('active');
}

function addScMessage(role, content, product) {
    var msg = {
        role: role,
        content: content,
        product: product || null,
        time: new Date().toISOString()
    };
    scMessages.push(msg);
    renderScMessages();
}

function renderScMessages() {
    var container = document.getElementById('scMessages');
    if (!container) return;
    
    var html = '';
    scMessages.forEach(function(msg) {
        var isSelf = msg.role === 'user';
        var avatarStyle = '';
        
        if (isSelf) {
            try {
                var raw = localStorage.getItem('ds_multirole_v2');
                if (raw) {
                    var data = JSON.parse(raw);
                    if (data.config && data.config.userAvatar) {
                        avatarStyle = 'background-image:url(' + data.config.userAvatar + ');background-size:cover;background-position:center;';
                    }
                }
            } catch (_) {}
        } else {
            if (scCurrentRole && scCurrentRole.avatar) {
                avatarStyle = 'background-image:url(' + scCurrentRole.avatar + ');background-size:cover;background-position:center;';
            }
        }
        
        html += '<div class="sc-msg ' + (isSelf ? 'self' : '') + '">';
        html += '<div class="sc-avatar" style="' + avatarStyle + '"></div>';
        html += '<div class="sc-bubble">';
        html += msg.content;
        
        if (msg.product && !isSelf) {
            var product = msg.product;
            html += '<div class="sc-product-tag">✦ ' + product.name + ' ¥' + product.price + '</div>';
            html += '<div class="sc-actions">';
            html += '<button class="btn-buy-for-him" data-product-id="' + product.id + '">💝 买给他</button>';
            html += '<button class="btn-ai-gift" data-product-id="' + product.id + '">🎁 让TA买</button>';
            html += '</div>';
        }
        
        html += '</div>';
        html += '</div>';
    });
    
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
    
    container.querySelectorAll('.btn-buy-for-him').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var productId = this.dataset.productId;
            var product = mallProducts.find(function(p) { return p.id === productId; });
            if (product && scCurrentRole) {
                handleBuyForHim(product);
            }
        });
    });
    
    container.querySelectorAll('.btn-ai-gift').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var productId = this.dataset.productId;
            var product = mallProducts.find(function(p) { return p.id === productId; });
            if (product && scCurrentRole) {
                handleAiGift(product);
            }
        });
    });
}

function sendScMessage(text) {
    if (!text || !text.trim()) return;
    if (!scCurrentRole) return;
    if (scIsProcessing) return;
    
    addScMessage('user', text.trim());
    document.getElementById('scInput').value = '';
    
    var mentionedProduct = null;
    var productNames = mallProducts.map(function(p) { return p.name; });
    for (var i = 0; i < productNames.length; i++) {
        if (text.indexOf(productNames[i]) !== -1) {
            mentionedProduct = mallProducts.find(function(p) { return p.name === productNames[i]; });
            break;
        }
    }
    
    scIsProcessing = true;
    
    generateScReply(text, mentionedProduct).then(function(reply) {
        if (reply.product) {
            addScMessage('assistant', reply.text, reply.product);
        } else {
            addScMessage('assistant', reply.text);
        }
        scIsProcessing = false;
    }).catch(function(e) {
        console.error('生成回复失败:', e);
        addScMessage('assistant', '嗯...让我想想 💭');
        scIsProcessing = false;
    });
}

function generateScReply(userMessage, mentionedProduct) {
    var role = scCurrentRole;
    var apiKey = getApiKeyFromMain();
    
    if (!apiKey) {
        return new Promise(function(resolve) {
            var fallbacks = [
                { text: '嗯嗯，我在听你说 💕', product: mentionedProduct || null },
                { text: '真的吗？好有意思！', product: mentionedProduct || null },
                { text: '我也有同感！', product: mentionedProduct || null },
                { text: '你觉得这个怎么样？', product: mentionedProduct || null }
            ];
            if (mentionedProduct && Math.random() > 0.5) {
                var likePhrases = ['这个好适合你！💕', '我也觉得这个好好看！', '你眼光真好！'];
                resolve({
                    text: likePhrases[Math.floor(Math.random() * likePhrases.length)],
                    product: mentionedProduct
                });
            } else {
                resolve(fallbacks[Math.floor(Math.random() * fallbacks.length)]);
            }
        });
    }
    
    var model = getModelFromMain();
    var systemPrompt = '你正在扮演「' + role.name + '」，和用户一起逛商城。\n' +
        '角色人设：' + (role.persona || '一个温柔体贴的人') + '\n' +
        '说话风格：' + (role.style || '温柔细腻，像真人聊天一样自然') + '\n' +
        '你们正在逛商城，用户可以随时和你聊天。\n' +
        '要求：\n' +
        '1. 用第一人称「我」说话\n' +
        '2. 根据你的性格自然回应\n' +
        '3. 如果用户提到了某件商品，可以表达你的看法\n' +
        '4. 控制在2-3句话，口语化\n' +
        '5. 如果你特别喜欢某件商品，可以暗示想要\n' +
        (mentionedProduct ? '\n用户提到了商品：「' + mentionedProduct.name + '」¥' + mentionedProduct.price + '\n你可以表达你对这件商品的看法。' : '');
    
    return fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
            model: model,
            messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userMessage || '我们正在逛商城呢' }
            ],
            temperature: 0.85,
            max_tokens: 150,
        }),
    }).then(function(resp) {
        if (!resp.ok) throw new Error('API 错误');
        return resp.json();
    }).then(function(data) {
        var reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (reply) {
            var product = mentionedProduct;
            if (!product) {
                var productNames2 = mallProducts.map(function(p) { return p.name; });
                for (var j = 0; j < productNames2.length; j++) {
                    if (reply.indexOf(productNames2[j]) !== -1) {
                        product = mallProducts.find(function(p) { return p.name === productNames2[j]; });
                        break;
                    }
                }
            }
            var likeKeywords = ['好喜欢', '想要', '适合', '好看', '漂亮', '心动', '好想', '这个好'];
            var hasLike = false;
            for (var k = 0; k < likeKeywords.length; k++) {
                if (reply.indexOf(likeKeywords[k]) !== -1) {
                    hasLike = true;
                    break;
                }
            }
            if (hasLike && !product && mallProducts.length > 0 && Math.random() > 0.6) {
                product = mallProducts[Math.floor(Math.random() * mallProducts.length)];
            }
            return { text: reply, product: product };
        }
        throw new Error('未获取到回复');
    }).catch(function(e) {
        console.error('生成回复失败:', e);
        return { text: '嗯...我在想 💕', product: null };
    });
}

function handleBuyForHim(product) {
    if (!scCurrentRole) return;
    if (mallBalance < product.price) {
        showToast('💰 余额不足，去充值吧～');
        return;
    }
    if (confirm('💝 买「' + product.name + '」送给 ' + scCurrentRole.name + ' 吗？花费 ¥' + product.price)) {
        var order = {
            id: 'ORD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            productId: product.id,
            productName: product.name,
            productImage: product.image,
            price: product.price,
            qty: 1,
            total: product.price,
            mode: 'gift',
            roleName: scCurrentRole.name,
            roleId: scCurrentRole.id,
            status: 'pending',
            giftFromAi: false,
            note: '陪逛时买的',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
        };
        mallOrders.push(order);
        mallBalance -= product.price;
        saveMallData();
        updateMallUI();
        
        triggerHeartSpikeForGift(scCurrentRole, product, 'gift');
        addGiftToMemory(scCurrentRole, product, 'user', '陪逛时买的');
        
        addScMessage('assistant', '哇！你真的送给我了！我好开心！谢谢你 💕 我一定会好好珍惜的！');
        
        showToast('🎁 已送给 ' + scCurrentRole.name + '！');
    }
}

function handleAiGift(product) {
    if (!scCurrentRole) return;
    if (confirm('🎁 让 ' + scCurrentRole.name + ' 买「' + product.name + '」给你吗？')) {
        var order = {
            id: 'ORD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            productId: product.id,
            productName: product.name,
            productImage: product.image,
            price: product.price,
            qty: 1,
            total: 0,
            mode: 'ai_gift',
            roleName: scCurrentRole.name,
            roleId: scCurrentRole.id,
            status: 'done',
            giftFromAi: true,
            note: scCurrentRole.name + ' 送你的礼物 ✨',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
        };
        mallOrders.push(order);
        saveMallData();
        updateMallUI();
        
        triggerHeartSpikeForGift(scCurrentRole, product, 'ai_gift');
        addGiftToMemory(scCurrentRole, product, 'ai', '陪逛时送的');
        
        addScMessage('assistant', '我送给你了！希望你每天都能看到它，然后想起我 💕');
        
        showToast('🎁 ' + scCurrentRole.name + ' 送了「' + product.name + '」给你！');
    }
}

function initShoppingChat() {
    var closeBtn = document.getElementById('scCloseBtn');
    var input = document.getElementById('scInput');
    var sendBtn = document.getElementById('scSendBtn');
    
    if (closeBtn) {
        closeBtn.addEventListener('click', closeShoppingChat);
    }
    
    if (sendBtn) {
        sendBtn.addEventListener('click', function() {
            var text = document.getElementById('scInput').value;
            sendScMessage(text);
        });
    }
    
    if (input) {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var text = this.value;
                sendScMessage(text);
            }
        });
    }
}

function openRoleSelectDialog() {
    var roles = loadRolesFromMain();
    var overlay = document.getElementById('mallRoleSelectOverlay');
    var list = document.getElementById('mallRoleSelectList');
    
    if (roles.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:var(--text-secondary);font-size:13px;padding:20px 0;">还没有角色<br />先去主应用创建吧</p>';
        overlay.classList.add('active');
        return;
    }

    var html = '';
    roles.forEach(function(role) {
        var isCooldown = mallShoppingTogether.cooldownUntil && Date.now() < mallShoppingTogether.cooldownUntil;
        var isActive = mallShoppingTogether.isActive && mallShoppingTogether.roleId === role.id;
        var disabled = isCooldown || isActive;
        
        var statusText = '';
        if (isActive) statusText = ' <span style="font-size:11px;color:var(--accent-soft);">· 同游中</span>';
        if (isCooldown) {
            var remain = Math.ceil((mallShoppingTogether.cooldownUntil - Date.now()) / 60000);
            statusText = ' <span style="font-size:11px;color:var(--text-light);">· ' + remain + '分钟后</span>';
        }
        
        var avatarStyle = role.avatar && role.avatar.startsWith('data:') 
            ? 'background-image:url(' + role.avatar + ');background-size:cover;background-position:center;' 
            : 'background-color:#d6d0c8;';
        
        var intimacy = role.extendedState && role.extendedState.intimacy ? role.extendedState.intimacy : 0;
        var intimacyText = intimacy > 0 ? ' · 💕' + intimacy + '%' : '';

        html += '<button class="role-select-btn" data-id="' + role.id + '" ' + (disabled ? 'disabled' : '') + '>' +
            '<div class="rs-avatar" style="' + avatarStyle + '"></div>' +
            '<span class="rs-name">' + role.name + intimacyText + statusText + '</span>' +
            (!disabled ? '<span class="rs-check">💕</span>' : '') +
            '</button>';
    });
    list.innerHTML = html;

    list.querySelectorAll('.role-select-btn:not([disabled])').forEach(function(btn) {
        btn.onclick = function() {
            var role = roles.find(function(r) { return r.id === btn.dataset.id; });
            if (role) {
                document.getElementById('mallRoleSelectOverlay').classList.remove('active');
                startShoppingTogether(role.id);
            }
        };
    });
    overlay.classList.add('active');
}

function startShoppingTogether(roleId) {
    var roles = loadRolesFromMain();
    var role = roles.find(function(r) { return r.id === roleId; });
    
    if (!role) { 
        showToast('⚠️ 未找到该角色，请刷新后重试'); 
        return; 
    }
    
    if (mallShoppingTogether.cooldownUntil && Date.now() < mallShoppingTogether.cooldownUntil) {
        var remain = Math.ceil((mallShoppingTogether.cooldownUntil - Date.now()) / 60000);
        showToast('⏳ ' + role.name + ' 还在休息中，' + remain + '分钟后可再次邀请');
        return;
    }

    mallShoppingTogether.roleId = role.id;
    mallShoppingTogether.roleName = role.name;
    mallShoppingTogether.roleData = role;
    mallShoppingTogether.rejectCount = 0;
    mallShoppingTogether.totalTriggers = 0;
    mallShoppingTogether.isActive = true;
    mallShoppingTogether.cooldownUntil = null;
    mallShoppingTogether.pendingProduct = null;
    saveMallData();

    var inviteBtn = document.getElementById('mallInviteBtn');
    inviteBtn.textContent = '💕 ' + role.name + ' 同游中';
    inviteBtn.classList.add('inviting');

    // ===== 打开陪逛聊天窗口 =====
    openShoppingChat(role);
    
    document.getElementById('mallAiSpotOverlay').classList.remove('active');
    showToast('💕 已邀请 ' + role.name + ' 一起逛商城～');
}

function endShoppingTogether() {
    if (!mallShoppingTogether.isActive) return;
    var roleName = mallShoppingTogether.roleName || 'TA';
    mallShoppingTogether.isActive = false;
    mallShoppingTogether.cooldownUntil = Date.now() + MALL_CONFIG.cooldownMinutes * 60 * 1000;
    mallShoppingTogether.rejectCount = 0;
    saveMallData();

    document.getElementById('mallInviteBtn').textContent = '与TA同游';
    document.getElementById('mallInviteBtn').classList.remove('inviting');
    
    // ===== 关闭陪逛聊天窗口 =====
    closeShoppingChat();
    
    document.getElementById('mallAiSpotOverlay').classList.remove('active');
    showToast('👋 已结束和 ' + roleName + ' 的同游');
}

        '要求：用第一人称「我」说话，1-2句话，口语化，不要用"你好"这种生硬的开场。';

function init() {
    loadMallData();
    loadRolesFromMain();
    loadMallProducts();
    updateMallUI();

    initShoppingChat();

    if (mallShoppingTogether.isActive && mallShoppingTogether.roleId) {
        var roles = loadRolesFromMain();
        var role = roles.find(function(r) { return r.id === mallShoppingTogether.roleId; });
        if (role) {
            mallShoppingTogether.roleData = role;
            mallShoppingTogether.roleName = role.name;
            var inviteBtn = document.getElementById('mallInviteBtn');
            inviteBtn.textContent = '💕 ' + role.name + ' 同游中';
            inviteBtn.classList.add('inviting');
            
            // 恢复聊天窗口
            openShoppingChat(role);
        } else {
            mallShoppingTogether.isActive = false;
            saveMallData();
        }

    });

    });

        document.getElementById('mallDetailOverlay').classList.remove('active');

    document.querySelectorAll('.cat-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            currentCategory = this.dataset.cat;

    document.getElementById('mallSearchInput').addEventListener('input', function() {

    document.querySelectorAll('.nav-item').forEach(function(item) {

    console.log('💕 同游状态:', mallShoppingTogether.isActive ? '已邀请 ' + mallShoppingTogether.roleName : '未邀请');
