<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行走动画测试</title>
    <style>
        body { background-color: #2a2a35; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; font-family: sans-serif; color: white; }
        .stage { width: 320px; height: 320px; background: #12101a; border: 4px solid #ff2a6d; border-radius: 10px; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 0 20px rgba(255,42,109,0.5); }
        #player { width: 64px; height: 128px; image-rendering: pixelated; }
        h2 { margin-top: 20px; color: #05d9e8; }
    </style>
</head>
<body>
    <div class="stage">
        <img id="player" src="assets/avatar/chibi_male_walk_down_1.png">
    </div>
    <h2>左下角像素小人测试</h2>
    <p>如果图片没显示，说明还没传或者没拉取</p>

    <script>
        const player = document.getElementById('player');
        let frame = 1;
        setInterval(() => {
            frame = frame === 4 ? 1 : frame + 1;
            player.src = `assets/avatar/chibi_male_walk_down_${frame}.png`;
        }, 200);
    </script>
</body>
</html>
