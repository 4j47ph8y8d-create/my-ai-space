<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="时光胶囊">
<title>时光胶囊</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; overflow: hidden; }

body {
    background: #F4F2F7;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 0;
}

.phone-frame {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 100vh;
    background: #F4F2F7;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
}

:root {
    --bg-primary: #F4F2F7;
    --bg-secondary: #EFE8F4;
    --bg-card: #FFFFFF;
    --bg-card-soft: #F8F5EE;
    --text-primary: #4A4558;
    --text-secondary: #8B82A0;
    --text-tertiary: #A89DB8;
    --border-color: rgba(212, 197, 224, 0.35);
    --shadow-color: rgba(184, 165, 199, 0.15);
    --header-bg: rgba(255, 255, 255, 0.7);
    --gradient-start: #D7D1E8;
    --gradient-mid: #E4D8E8;
    --gradient-end: #F4F2F7;
    --accent: #B8A5C7;
    --accent-strong: #9B85B0;
    --accent-soft: #E4D8E8;
    --pink: #F5B7C8;
    --safe-top: 0px;
    --safe-bottom: 0px;
}

@supports (padding: env(safe-area-inset-top)) {
    :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== 加载动画 ===== */
.loader-overlay {
    position: absolute;
    inset: 0;
    z-index: 1000;
    background: linear-gradient(180deg, #D7D1E8 0%, #E4D8E8 45%, #F0E8F2 80%, #F4F2F7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, transform 0.5s ease;
}

.loader-overlay.hidden { opacity: 0; transform: scale(1.02); pointer-events: none; }

.loader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 20px;
}

.rings-container {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ring { position: absolute; border-radius: 50%; border: 1.5px solid transparent; pointer-events: none; }

.ring-outer { width: 130px; height: 130px; border-color: rgba(155, 133, 176, 0.35); border-top-color: rgba(155, 133, 176, 0.9); border-right-color: rgba(155, 133, 176, 0.15); border-bottom-color: rgba(155, 133, 176, 0.08); animation: spinOuter 2.8s linear infinite; }
.ring-middle { width: 100px; height: 100px; border-color: rgba(245, 183, 200, 0.35); border-top-color: rgba(245, 183, 200, 0.85); border-right-color: rgba(245, 183, 200, 0.12); border-bottom-color: rgba(245, 183, 200, 0.06); animation: spinMiddle 2s linear infinite reverse; }
.ring-inner { width: 70px; height: 70px; border-color: rgba(184, 165, 199, 0.35); border-top-color: rgba(184, 165, 199, 0.8); border-right-color: rgba(184, 165, 199, 0.1); border-bottom-color: rgba(184, 165, 199, 0.05); animation: spinInner 1.4s linear infinite; }

@keyframes spinOuter { to { transform: rotate(360deg); } }
@keyframes spinMiddle { to { transform: rotate(-360deg); } }
@keyframes spinInner { to { transform: rotate(360deg); } }

.capsule-wrapper {
    position: relative;
    z-index: 2;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: capsuleFloat 2.5s ease-in-out infinite;
}

.capsule-slant {
    width: 16px;
    height: 52px;
    border-radius: 8px;
    background: linear-gradient(180deg, #B8A5C7, #9B85B0);
    transform: rotate(35deg);
    box-shadow: 0 4px 16px rgba(155, 133, 176, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    position: relative;
    flex-shrink: 0;
}

.capsule-slant::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 3px;
    width: 4px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    pointer-events: none;
}

.capsule-slant .line { position: absolute; left: 50%; transform: translateX(-50%); width: 8px; height: 0.5px; background: rgba(255,255,255,0.15); border-radius: 2px; }
.capsule-slant .line:nth-child(1) { top: 12px; }
.capsule-slant .line:nth-child(2) { top: 18px; }
.capsule-slant .line:nth-child(3) { top: 24px; }
.capsule-slant .line:nth-child(4) { top: 30px; }
.capsule-slant .line:nth-child(5) { top: 36px; }

.capsule-slant .dot { position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%; background: rgba(255,255,255,0.3); animation: dotPulse 2s ease-in-out infinite; }
.capsule-slant .dot:nth-child(6) { top: 8px; right: 3px; animation-delay: 0s; }
.capsule-slant .dot:nth-child(7) { bottom: 8px; left: 3px; animation-delay: 0.6s; }

@keyframes dotPulse { 0%,100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 0.5; transform: scale(1.2); } }
@keyframes capsuleFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.01); } }

.loader-text { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.loader-text .en { font-size: 13px; font-weight: 400; color: rgba(74, 69, 88, 0.35); letter-spacing: 4px; text-transform: uppercase; animation: textPulse 2s ease-in-out infinite; }
.loader-text .en .highlight { color: rgba(155, 133, 176, 0.9); }
.loader-text .zh { font-size: 12px; font-weight: 300; color: rgba(74, 69, 88, 0.2); letter-spacing: 6px; animation: textPulse 2s ease-in-out infinite 0.3s; }

@keyframes textPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.loader-progress { width: 160px; height: 2px; background: rgba(74, 69, 88, 0.06); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.loader-progress .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #B8A5C7, #9B85B0); border-radius: 4px; animation: progressFill 2.5s ease-in-out infinite; }

@keyframes progressFill { 0% { width: 0%; } 50% { width: 70%; } 80% { width: 90%; } 100% { width: 0%; } }

.loader-sub { font-size: 10px; color: rgba(74, 69, 88, 0.15); letter-spacing: 2px; margin-top: 2px; }

/* ===== 顶部渐变头 ===== */
.memory-top {
    position: relative;
    flex-shrink: 0;
    padding: calc(12px + var(--safe-top, 0px)) 18px 14px;
    background: linear-gradient(180deg,
        #D7D1E8 0%,
        #E4D8E8 45%,
        #F0E8F2 80%,
        #F4F2F7 100%);
    overflow: hidden;
    z-index: 5;
}

.memory-top::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
}

.memory-top::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -50px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
}

.memory-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
}

.memory-topbar .top-back {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    border: none;
    color: #4A4558;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
}

.memory-topbar .top-back:active { transform: scale(0.9); background: #FFFFFF; }

.memory-topbar .top-actions { display: flex; gap: 8px; }

.memory-topbar .top-action-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    border: none;
    color: #6B5F80;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
}

.memory-topbar .top-action-btn:active { transform: scale(0.9); background: #FFFFFF; }

.memory-title-wrap {
    position: relative;
    z-index: 2;
    margin-top: 22px;
    padding: 0 4px;
}

.memory-title {
    font-size: 26px;
    font-weight: 700;
    color: #4A4558;
    letter-spacing: 2px;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 10px;
}

.memory-title i { color: #9B85B0; font-size: 22px; }

.memory-subtitle {
    font-size: 13px;
    color: #8B82A0;
    margin-top: 6px;
    letter-spacing: 1px;
    font-weight: 400;
}

/* ===== 主内容区 ===== */
.memory-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 24px;
    margin-top: -10px;
    position: relative;
    z-index: 3;
    -webkit-overflow-scrolling: touch;
}

/* ===== 角色选择条 ===== */
.role-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 4px 10px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}

.role-strip::-webkit-scrollbar { display: none; }

.role-chip {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: 0.2s;
    min-width: 72px;
}

.role-chip:active { transform: scale(0.95); }

.role-chip.active {
    background: linear-gradient(135deg, rgba(184, 165, 199, 0.25), rgba(228, 216, 232, 0.35));
    border-color: #B8A5C7;
    box-shadow: 0 4px 14px rgba(184, 165, 199, 0.25);
}

.role-chip .chip-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #B8A5C7;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    border: 2px solid rgba(255, 255, 255, 0.8);
}

.role-chip .chip-name {
    font-size: 11px;
    color: #4A4558;
    font-weight: 500;
    max-width: 68px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.3px;
}

.role-chip.active .chip-name { color: #6B5F80; font-weight: 600; }

/* ===== 关系概览卡 ===== */
.relation-card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 22px;
    padding: 18px 20px 16px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 8px 28px rgba(184, 165, 199, 0.15);
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
}

.relation-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -30%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(245, 183, 200, 0.15), transparent 70%);
    pointer-events: none;
}

.relation-card .rc-title {
    font-size: 11px;
    color: #A89DB8;
    letter-spacing: 2px;
    margin-bottom: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 1;
}

.relation-card .rc-title i { color: #F5B7C8; }

.relation-card .rc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    text-align: center;
    position: relative;
    z-index: 1;
}

.relation-card .rc-grid .rc-item { padding: 2px 0; }

.relation-card .rc-grid .rc-item .rc-number {
    font-size: 20px;
    font-weight: 800;
    color: #4A4558;
    letter-spacing: -0.5px;
    transition: 0.3s;
    font-variant-numeric: tabular-nums;
}

.relation-card .rc-grid .rc-item .rc-number.heart-color {
    color: #E88BA5;
    text-shadow: 0 0 30px rgba(245, 183, 200, 0.3);
}

.relation-card .rc-grid .rc-item .rc-label {
    font-size: 9px;
    color: #A89DB8;
    margin-top: 2px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.relation-card .rc-progress {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
}

.relation-card .rc-progress .rc-bar {
    flex: 1;
    height: 5px;
    background: rgba(212, 197, 224, 0.4);
    border-radius: 4px;
    overflow: hidden;
}

.relation-card .rc-progress .rc-bar .rc-fill {
    height: 100%;
    background: linear-gradient(90deg, #F5B7C8, #B8A5C7, #9B85B0);
    border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.relation-card .rc-progress .rc-percent {
    font-size: 12px;
    font-weight: 700;
    color: #9B85B0;
    min-width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.relation-card .rc-stages {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 9px;
    color: #A89DB8;
    padding: 0 2px;
    position: relative;
    z-index: 1;
}

.relation-card .rc-stages .stage {
    opacity: 0.35;
    transition: all 0.4s ease;
    font-weight: 400;
    padding: 2px 6px;
    border-radius: 6px;
}

.relation-card .rc-stages .stage.active {
    opacity: 1;
    color: #9B85B0;
    font-weight: 700;
    background: rgba(184, 165, 199, 0.15);
}

/* ===== 胶囊式 tab 切换 ===== */
.memory-tabs {
    display: flex;
    gap: 6px;
    padding: 5px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(184, 165, 199, 0.1);
}

.memory-tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: #8B82A0;
    cursor: pointer;
    border: none;
    background: none;
    border-radius: 12px;
    transition: all 0.25s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.memory-tab .tab-icon { font-size: 13px; }

.memory-tab.active {
    background: linear-gradient(135deg, #B8A5C7, #9B85B0);
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(155, 133, 176, 0.35);
    font-weight: 600;
}

.memory-tab:active { transform: scale(0.97); }

/* ===== 面板 ===== */
.memory-panel { display: none; animation: fadeSlideIn 0.35s ease; }
.memory-panel.active { display: block; }

@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 记忆卡片 ===== */
.mem-search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
}

.mem-search-bar .search-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
}

.mem-search-bar input {
    width: 100%;
    padding: 11px 40px 11px 40px;
    border: 1px solid rgba(212, 197, 224, 0.5);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.8);
    color: #4A4558;
    font-size: 13px;
    outline: none;
    transition: 0.2s;
    font-family: inherit;
}

.mem-search-bar input:focus {
    border-color: #B8A5C7;
    background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(184, 165, 199, 0.12);
}

.mem-search-bar input::placeholder { color: #A89DB8; opacity: 0.7; }

.mem-search-bar .search-icon {
    position: absolute;
    left: 14px;
    color: #B8A5C7;
    font-size: 13px;
    pointer-events: none;
}

.mem-search-bar .search-clear {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #A89DB8;
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    display: none;
}

.mem-search-bar .search-clear.show { display: block; }

.mem-batch-toggle {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    border: 1px solid rgba(212, 197, 224, 0.5);
    background: rgba(255, 255, 255, 0.8);
    color: #9B85B0;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mem-batch-toggle:active { transform: scale(0.92); }
.mem-batch-toggle.active { background: linear-gradient(135deg, #B8A5C7, #9B85B0); color: #fff; border-color: transparent; }

/* 批量操作栏 */
.mem-batch-bar {
    display: none;
    gap: 8px;
    margin-bottom: 12px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 14px;
    border: 1px solid rgba(212, 197, 224, 0.5);
    align-items: center;
    justify-content: space-between;
    animation: fadeSlideIn 0.25s ease;
}

.mem-batch-bar.show { display: flex; }

.mem-batch-bar .batch-info { font-size: 12px; color: #8B82A0; }
.mem-batch-bar .batch-info span { color: #9B85B0; font-weight: 700; }

.mem-batch-bar .batch-btns { display: flex; gap: 6px; }

.mem-batch-bar .batch-btns button {
    padding: 6px 12px;
    border: none;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
}

.mem-batch-bar .batch-btns button:active { transform: scale(0.95); }
.mem-batch-bar .batch-btns .btn-upgrade { background: rgba(184, 165, 199, 0.25); color: #6B5F80; }
.mem-batch-bar .batch-btns .btn-delete { background: rgba(240, 130, 130, 0.15); color: #D07A7A; }
.mem-batch-bar .batch-btns .btn-cancel { background: rgba(212, 197, 224, 0.4); color: #8B82A0; }

/* 记忆分类 */
.mem-category { margin-bottom: 12px; }

.mem-category .cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
    box-shadow: 0 2px 10px rgba(184, 165, 199, 0.08);
}

.mem-category .cat-header:active { background: #FFFFFF; transform: scale(0.99); }

.mem-category .cat-header .cat-icon { font-size: 15px; }
.mem-category .cat-header .cat-name { font-size: 13px; font-weight: 600; color: #4A4558; flex: 1; letter-spacing: 0.5px; }
.mem-category .cat-header .cat-count {
    font-size: 10px;
    color: #8B82A0;
    background: rgba(228, 216, 232, 0.6);
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 500;
}

.mem-category .cat-header .cat-arrow {
    font-size: 11px;
    color: #A89DB8;
    transition: transform 0.3s ease;
}

.mem-category .cat-header .cat-arrow.open { transform: rotate(180deg); }

.mem-category .cat-header .cat-checkbox {
    width: 16px;
    height: 16px;
    accent-color: #B8A5C7;
    cursor: pointer;
}

.mem-category .cat-body {
    padding: 8px 0 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    max-height: 9999px;
}

.mem-category .cat-body.collapsed { max-height: 0; padding: 0; }

/* 记忆条目 */
.mem-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    transition: 0.2s;

<script>
// ============================================================
// 📦 时光胶囊 v2.0 - 藕粉紫浅色版
// ============================================================

var CLEANUP_RULES = {
    RECENT_TO_ARCHIVE_DAYS: 30,
    ARCHIVE_TO_DELETE_DAYS: 45
};

var roles = [];
var currentRoleId = null;
var currentTab = 'summary';
var toastTimer = null;
var confirmCallback = null;
var isAddingMemory = false;
var memorySearchKeyword = '';
var selectedMemories = [];
var batchMode = false;
var categoryStates = { core: true, recent: true, archived: true };

// ========== 工具函数 ==========
function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    text = String(text);
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getIntimacyLevel(intimacy) {
    if (intimacy < 20) return '初识';
    if (intimacy < 40) return '熟悉';
    if (intimacy < 60) return '亲密';
    if (intimacy < 80) return '依赖';
    return '灵魂伴侣';
}

function getStageIndex(intimacy) {
    if (intimacy < 20) return 0;
    if (intimacy < 40) return 1;
    if (intimacy < 60) return 2;
    if (intimacy < 80) return 3;
    return 4;
}

function showToast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    clearTimeout(toastTimer);
    el.textContent = msg;
    el.style.display = 'block';
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(10px)';
    el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    requestAnimationFrame(function() {
        el.style.opacity = '1';
        el.style.transform = 'translateX(-50%) translateY(0)';
    });
    toastTimer = setTimeout(function() {
        el.style.opacity = '0';
        el.style.transform = 'translateX(-50%) translateY(10px)';
        setTimeout(function() { if (el) el.style.display = 'none'; }, 300);
    }, 2500);
}

function getDaysBetween(date1, date2) {
    var d1 = new Date(date1);
    var d2 = new Date(date2);
    var diff = d2.getTime() - d1.getTime();
    return Math.max(0, Math.floor(diff / (24 * 60 * 60 * 1000)));
}

function getTodayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDateDisplay(dateStr) {
    try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '未知时间';
        var now = new Date();
        var today = getTodayKey();
        var targetKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if (targetKey === today) return '今天 ' + d.toTimeString().slice(0, 5);
        var yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        var yesterdayKey = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
        if (targetKey === yesterdayKey) return '昨天 ' + d.toTimeString().slice(0, 5);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + d.toTimeString().slice(0, 5);
    } catch (e) { return '未知时间'; }
}

function getMemoryText(mem) {
    var text = mem.text || mem;
    if (typeof text !== 'string') text = text.text || '';
    return text;
}

// ========== IndexedDB 读取 ==========
function openMainDB() {
    return new Promise(function(resolve, reject) {
        var request = indexedDB.open('LunarReverieDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('data')) {
                db.createObjectStore('data', { keyPath: 'key' });
            }
        };
        request.onsuccess = function(e) { resolve(e.target.result); };
        request.onerror = function(e) { reject(e.target.error); };
    });
}

function idbGet(key) {
    return openMainDB().then(function(db) {
        return new Promise(function(resolve) {
            if (!db.objectStoreNames.contains('data')) { db.close(); resolve(null); return; }
            var tx = db.transaction('data', 'readonly');
            var store = tx.objectStore('data');
            var req = store.get(key);
            req.onsuccess = function() { db.close(); resolve(req.result ? req.result.value : null); };
            req.onerror = function() { db.close(); resolve(null); };
        });
    }).catch(function() { return null; });
}

function idbSet(key, value) {
    return openMainDB().then(function(db) {
        return new Promise(function(resolve, reject) {
            if (!db.objectStoreNames.contains('data')) { db.close(); reject(new Error('no store')); return; }
            var tx = db.transaction('data', 'readwrite');
            var store = tx.objectStore('data');
            var req = store.put({ key: key, value: value, updatedAt: Date.now() });
            req.onsuccess = function() { db.close(); resolve(); };
            req.onerror = function() { db.close(); reject(req.error); };
        });
    });
}

function loadRoleMessagesFromIDB(roleId) {
    return idbGet('role_messages_' + roleId).then(function(msgs) {
        return Array.isArray(msgs) ? msgs : [];
    });
}

function loadRoleAvatarFromIDB(roleId) {
    return idbGet('role_avatar_' + roleId).then(function(data) {
        return typeof data === 'string' ? data : '';
    });
}

function loadRoleChatBgFromIDB(roleId) {
    return idbGet('role_chatbg_' + roleId).then(function(data) {
        return typeof data === 'string' ? data : '';
    });
}

// ========== 自动清理记忆 ==========
function cleanupMemories() {
    var now = Date.now();
    var totalCleaned = 0, totalArchived = 0;

    roles.forEach(function(role) {
        if (!Array.isArray(role.memory)) return;
        var newMemory = [];
        role.memory.forEach(function(mem) {
            var level = mem.level || 'core';
            // 核心记忆永不自动删除
            if (level === 'core') { newMemory.push(mem); return; }
            if (!mem.timestamp) { newMemory.push(mem); return; }
            var age = (now - mem.timestamp) / (24 * 60 * 60 * 1000);
            if (level === 'recent') {
                if (age > CLEANUP_RULES.RECENT_TO_ARCHIVE_DAYS) {
                    mem.level = 'archived';
                    totalArchived++;
                }
                newMemory.push(mem);
                return;
            }
            if (level === 'archived') {
                if (age > CLEANUP_RULES.ARCHIVE_TO_DELETE_DAYS) {
                    totalCleaned++;
                } else {
                    newMemory.push(mem);
                }
                return;
            }
            newMemory.push(mem);
        });
        role.memory = newMemory;
    });

    if (totalCleaned > 0 || totalArchived > 0) {
        var msg = '';
        if (totalArchived > 0) msg += '📦 ' + totalArchived + ' 条近期记忆已归档 ';
        if (totalCleaned > 0) msg += '🗑️ ' + totalCleaned + ' 条归档记忆已清理';
        if (msg) showToast('🧹 ' + msg);
        saveData();
        console.log('🧹 清理完成: 归档 ' + totalArchived + ' 条，删除 ' + totalCleaned + ' 条');
    }
}

// ========== 数据加载 ==========
function loadData() {
    return new Promise(function(resolve) {
        try {
            var raw = localStorage.getItem('ds_multirole_v2');
            if (!raw) { showToast('⚠️ 未找到数据，请先使用主应用'); resolve(false); return; }
            var data = JSON.parse(raw);
            if (!data.roles || !Array.isArray(data.roles) || data.roles.length === 0) {
                showToast('⚠️ 数据为空，请先创建角色');
                resolve(false);
                return;
            }

            roles = data.roles;
            roles.forEach(function(role) {
                if (!role.extendedState) {
                    role.extendedState = {
                        lifeLogs: [],
                        lastActiveMessage: { time: null, content: '', topic: '' },
                        intimacy: 0,
                        contextMemory: { lastTopic: '', lastUserEmotion: '', lastUserMessage: '', lastConversationSummary: '' },
                        lastUserMessageTime: 0,
                        lastAiMessageTime: 0,
                        messageCount: 0,
                        totalHeartSpikes: 0,
                        contextSummary: '你们还没有深入聊过，ta好像还在了解你。',
                        summaryHistory: []
                    };
                }
                if (!role.extendedState.summaryHistory || !Array.isArray(role.extendedState.summaryHistory)) {
                    role.extendedState.summaryHistory = [];
                }
                if (!role.heartData) {
                    role.heartData = { value: 65, restingValue: 65, peakValue: 65, signature: '今天也很想你 💕', recentTrigger: '初次相遇' };
                }
                if (!Array.isArray(role.memory)) { role.memory = []; }
                if (!Array.isArray(role.messages)) { role.messages = []; }
                if (!role.createdAt) {
                    if (role.messages && role.messages.length > 0) {
                        role.createdAt = role.messages[0].time;
                    } else {
                        role.createdAt = new Date().toISOString();
                    }
                }
                var testDate = new Date(role.createdAt);
                if (isNaN(testDate.getTime())) role.createdAt = new Date().toISOString();
            });

            var params = new URLSearchParams(window.location.search);
            var urlRoleId = params.get('roleId');
            if (urlRoleId && roles.find(function(r) { return r.id === urlRoleId; })) {
                currentRoleId = urlRoleId;
            } else {
                currentRoleId = data.currentRoleId || roles[0].id;
            }

            // ⭐ 从 IndexedDB 加载消息、头像、背景
            var tasks = roles.map(function(role) {
                var subTasks = [];
                if (!Array.isArray(role.messages) || role.messages.length === 0) {
                    subTasks.push(loadRoleMessagesFromIDB(role.id).then(function(msgs) {
                        if (msgs.length > 0) role.messages = msgs;
                    }));
                }
                if (!role.avatar) {
                    subTasks.push(loadRoleAvatarFromIDB(role.id).then(function(av) {
                        if (av) role.avatar = av;
                    }));
                }
                if (!role.chatBg) {
                    subTasks.push(loadRoleChatBgFromIDB(role.id).then(function(bg) {
                        if (bg) role.chatBg = bg;
                    }));
                }
                return Promise.all(subTasks);
            });

            Promise.all(tasks).then(function() {
                cleanupMemories();
                resolve(true);
            }).catch(function() {
                cleanupMemories();
                resolve(true);
            });

        } catch (e) {
            console.error('加载数据失败:', e);
            showToast('❌ 加载数据失败');
            resolve(false);
        }
    });
}

function saveData() {
    try {
        // 只写 local 存储中不含消息的部分
        var raw = localStorage.getItem('ds_multirole_v2');
        if (!raw) return;
        var data = JSON.parse(raw);
        data.roles = roles.map(function(r) {
            var clone = {};
            Object.keys(r).forEach(function(k) {
                if (k === 'messages' || k === 'avatar' || k === 'chatBg') return;
                clone[k] = r[k];
            });
            clone.messages = [];
            clone.avatar = '';
            clone.chatBg = '';
            return clone;
        });
        data.currentRoleId = currentRoleId;
        localStorage.setItem('ds_multirole_v2', JSON.stringify(data));

        // 同步写 IndexedDB 的 memory、extendedState
        roles.forEach(function(r) {
            var memToSave = {
                memory: r.memory || [],
                extendedState: r.extendedState || null,
                heartData: r.heartData || null
            };
            idbSet('role_mem_' + r.id, memToSave).catch(function() {});
        });
    } catch (e) {
        console.error('保存数据失败:', e);
    }
}

// ========== 获取当前角色 ==========
function getCurrentRole() {
    return roles.find(function(r) { return r.id === currentRoleId; }) || roles[0] || null;
}

// ========== 渲染角色选择条 ==========
function renderRoleStrip() {
    var strip = document.getElementById('roleStrip');
    if (!strip) return;

    if (roles.length === 0) {
        strip.innerHTML = '<div style="color:#A89DB8;font-size:12px;padding:10px;">暂无角色</div>';
        return;
    }

    var html = '';
    roles.forEach(function(role) {
        var isActive = role.id === currentRoleId;
        var avatarStyle = role.avatar
            ? 'background-image:url(' + role.avatar + ');background-size:cover;background-position:center;'
            : '';
        var avatarContent = role.avatar ? '' : escapeHtml((role.name || '?').charAt(0));

        html += '<div class="role-chip ' + (isActive ? 'active' : '') + '" data-roleid="' + role.id + '">' +
            '<div class="chip-avatar" style="' + avatarStyle + '">' + avatarContent + '</div>' +
            '<div class="chip-name">' + escapeHtml(role.name || '未命名') + '</div>' +
            '</div>';
    });

    strip.innerHTML = html;

    strip.querySelectorAll('.role-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
            var rid = this.dataset.roleid;
            if (rid === currentRoleId) return;
            currentRoleId = rid;
            selectedMemories = [];
            memorySearchKeyword = '';
            saveData();
            renderRoleStrip();
            renderAll();
        });
    });
}

// ========== 关系卡片 ==========
function renderRelationCard(role) {
    if (!role) return;

    var intimacy = role.extendedState ? role.extendedState.intimacy || 0 : 0;
    var messages = role.messages || [];
    var days = getDaysBetween(role.createdAt || new Date(), new Date());
    var stage = getIntimacyLevel(intimacy);
    var stageIdx = getStageIndex(intimacy);

    var intimacyEl = document.getElementById('intimacyValue');
    var daysEl = document.getElementById('daysValue');
    var stageEl = document.getElementById('stageValue');
    var msgEl = document.getElementById('msgCountValue');
    var bar = document.getElementById('intimacyBar');
    var percentEl = document.getElementById('intimacyPercent');

    var oldIntimacy = intimacyEl ? parseInt(intimacyEl.textContent) || 0 : 0;
    var oldMsg = msgEl ? parseInt(msgEl.textContent) || 0 : 0;

    if (intimacyEl) {
        intimacyEl.textContent = intimacy + '%';
        if (intimacy !== oldIntimacy) {
            intimacyEl.classList.remove('animate');
            void intimacyEl.offsetHeight;
            intimacyEl.classList.add('animate');
        }
    }
    if (daysEl) daysEl.textContent = days;
    if (stageEl) stageEl.textContent = stage;
    if (msgEl) {
        msgEl.textContent = messages.length;
        if (messages.length !== oldMsg) {
            msgEl.classList.remove('animate');
            void msgEl.offsetHeight;
            msgEl.classList.add('animate');
        }
    }

    var percent = Math.min(100, intimacy);
    if (bar) bar.style.width = percent + '%';
    if (percentEl) percentEl.textContent = percent + '%';

    document.querySelectorAll('#stageLabels .stage').forEach(function(el) {
        var idx = parseInt(el.dataset.stage);
        el.classList.toggle('active', idx === stageIdx);
    });
}

// ========== 对话摘要 ==========
function renderSummary(role) {
    var panel = document.getElementById('panelSummary');
    if (!panel) return;

    if (!role) {
        panel.innerHTML = '<div class="empty-state"><i class="fas fa-comment-dots"></i><p>请先选择一个角色</p></div>';
        return;
    }

    var history = role.extendedState ? role.extendedState.summaryHistory || [] : [];
    var currentSummary = role.extendedState ? role.extendedState.contextSummary || '' : '';

    var html = '';

    // 当前摘要
    if (currentSummary && currentSummary !== '你们还没有深入聊过，ta好像还在了解你。') {
        html += '<div class="summary-item is-current">' +
            '<div class="s-header">' +
                '<span class="s-time"><i class="fas fa-star"></i>当前摘要</span>' +

            '</div>' +
            '<div class="s-content">' + escapeHtml(currentSummary) + '</div>' +
            '<div class="s-footer"><span class="s-badge">最新</span></div>' +
        '</div>';
    }

    // 历史摘要
    var sorted = history.slice().sort(function(a, b) {
        return new Date(b.time) - new Date(a.time);
    });

    sorted.forEach(function(item) {
        var timeDisplay = formatDateDisplay(item.time);
        html += '<div class="summary-item">' +
            '<div class="s-header">' +
                '<span class="s-time"><i class="fas fa-clock"></i>' + timeDisplay + '</span>' +
                '<div class="s-actions"><button class="btn-del-summary" data-id="' + item.id + '" title="删除"><i class="fas fa-times"></i></button></div>' +
            '</div>' +
            '<div class="s-content">' + escapeHtml(item.content) + '</div>' +
            '<div class="s-footer">' +
                (item.msgId
                    ? '<span></span><button class="jump-btn" data-msgid="' + item.msgId + '"><i class="fas fa-comment"></i>跳转到聊天</button>'
                    : '<span class="s-badge">已归档</span><span></span>'
                ) +
            '</div>' +
        '</div>';
    });

    if (!html) {
        panel.innerHTML = '<div class="empty-state"><i class="fas fa-comment-dots"></i><p>还没有对话摘要</p><span class="empty-hint">多聊聊天，我会帮你记录重要的对话</span></div>';
        return;
    }

    panel.innerHTML = html;

    // 绑定事件
    panel.querySelectorAll('.btn-del-summary-current').forEach(function(btn) {
        btn.addEventListener('click', function() {
            showConfirm('删除当前摘要', '确定要删除当前摘要吗？', function() {
                if (role.extendedState) {
                    role.extendedState.contextSummary = '你们还没有深入聊过，ta好像还在了解你。';
                    saveData();
                    renderSummary(role);
                    renderRelationCard(role);
                    showToast('✅ 已删除');
                }
            });
        });
    });

    panel.querySelectorAll('.btn-del-summary').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var id = this.dataset.id;
            showConfirm('删除摘要', '确定要删除这条摘要吗？', function() {
                if (role.extendedState && role.extendedState.summaryHistory) {
                    var idx = role.extendedState.summaryHistory.findIndex(function(s) { return s.id === id; });
                    if (idx !== -1) {
                        role.extendedState.summaryHistory.splice(idx, 1);
                        saveData();
                        renderSummary(role);
                        showToast('✅ 已删除');
                    }
                }
            });
        });
    });

    panel.querySelectorAll('.jump-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var msgId = this.dataset.msgid;
            var frame = document.querySelector('.phone-frame');
            if (frame) {
                frame.classList.add('page-leaving');
                setTimeout(function() {
                    window.location.href = 'index.html?chat=' + role.id + '&msg=' + msgId;
                }, 350);
            } else {
                window.location.href = 'index.html?chat=' + role.id + '&msg=' + msgId;
            }
        });
    });
}

// ========== 记忆库 ==========
function renderMemory(role) {
    var panel = document.getElementById('panelMemory');
    if (!panel) return;

    if (!role) {
        panel.innerHTML = '<div class="empty-state"><i class="fas fa-brain"></i><p>请先选择一个角色</p></div>';
        return;
    }

    var allMemories = role.memory || [];

    var html = '';

    // 搜索栏 + 批量按钮
    html += '<div class="mem-search-bar">' +
        '<div class="search-wrap">' +
            '<i class="fas fa-search search-icon"></i>' +
            '<input type="text" id="memorySearchInput" placeholder="搜索记忆..." value="' + escapeHtml(memorySearchKeyword) + '" />' +
            '<button class="search-clear' + (memorySearchKeyword ? ' show' : '') + '" id="memorySearchClear"><i class="fas fa-times-circle"></i></button>' +
        '</div>' +
        '<button class="mem-batch-toggle' + (batchMode ? ' active' : '') + '" id="batchToggleBtn" title="批量管理"><i class="fas fa-check-square"></i></button>' +
    '</div>';

    // 批量操作栏
    html += '<div class="mem-batch-bar' + (batchMode ? ' show' : '') + '" id="batchActions">' +
        '<span class="batch-info">已选 <span id="selectedCount">' + selectedMemories.length + '</span> 条</span>' +
        '<div class="batch-btns">' +
            '<button class="btn-upgrade" id="batchUpgradeBtn"><i class="fas fa-arrow-up"></i> 升级</button>' +
            '<button class="btn-delete" id="batchDeleteBtn"><i class="fas fa-trash-alt"></i> 删除</button>' +
        '</div>' +
    '</div>';

    // 过滤
    var filtered = allMemories;
    if (memorySearchKeyword.trim()) {
        var keyword = memorySearchKeyword.trim().toLowerCase();
        filtered = allMemories.filter(function(m) {
            return getMemoryText(m).toLowerCase().indexOf(keyword) !== -1;
        });
    }

    var core = filtered.filter(function(m) { return m.level === 'core' || !m.level; });
    var recent = filtered.filter(function(m) { return m.level === 'recent'; });
    var archived = filtered.filter(function(m) { return m.level === 'archived'; });

    if (filtered.length === 0) {
        if (allMemories.length === 0) {
            html += '<div class="empty-state"><i class="fas fa-inbox"></i><p>还没有保存任何记忆</p><span class="empty-hint">聊天中会慢慢积累关于你的事</span></div>';
        } else {
            html += '<div class="empty-state"><i class="fas fa-search"></i><p>没有找到匹配的记忆</p><span class="empty-hint">试试其他关键词</span></div>';
        }
    } else {
        html += renderCategory('核心记忆', 'core', core, '📌', true);
        html += renderCategory('近期记忆', 'recent', recent, '🕐', false, '30天后自动归档');
        html += renderCategory('归档记忆', 'archived', archived, '📦', false, '45天后自动删除');
    }

    // 添加记忆
    html += '<div class="mem-add-section">' +
        '<input type="text" id="memoryAddInput" placeholder="添加新记忆..." maxlength="100" />' +
        '<button class="add-btn" id="memoryAddBtn"><i class="fas fa-plus"></i> 添加</button>' +
    '</div>';

    panel.innerHTML = html;

    bindMemoryEvents(role);
}

function renderCategory(label, catId, items, icon, isCore, hint) {
    if (items.length === 0) {
        return '<div class="mem-category" style="opacity:0.35;">' +
            '<div class="cat-header" style="cursor:default;background:transparent;border-color:transparent;box-shadow:none;">' +
                '<span class="cat-icon">' + icon + '</span>' +
                '<span class="cat-name">' + label + '</span>' +
                '<span class="cat-count">0 条</span>' +
            '</div>' +
        '</div>';
    }

    var isOpen = categoryStates[catId] !== false;
    var arrowClass = isOpen ? 'open' : '';
    var bodyClass = isOpen ? '' : 'collapsed';

    var html = '<div class="mem-category">';
    html += '<div class="cat-header" data-cat-id="' + catId + '">';
    if (batchMode) {
        html += '<input type="checkbox" class="cat-checkbox" data-cat-id="' + catId + '" />';
    }
    html += '<span class="cat-icon">' + icon + '</span>';
    html += '<span class="cat-name">' + label + '</span>';
    html += '<span class="cat-count">' + items.length + ' 条</span>';
    html += '<span class="cat-arrow ' + arrowClass + '"><i class="fas fa-chevron-down"></i></span>';
    html += '</div>';
    html += '<div class="cat-body ' + bodyClass + '">';

    items.forEach(function(mem) {
        var text = getMemoryText(mem);
        var isSelected = selectedMemories.indexOf(text) !== -1;
        var level = mem.level || 'core';
        var showUpgrade = (level === 'recent' || level === 'archived');

        html += '<div class="mem-item' + (batchMode ? ' batch-mode' : '') + '" data-cat="' + catId + '">';
        html += '<input type="checkbox" class="item-checkbox" data-text="' + escapeHtml(text) + '" data-cat-id="' + catId + '"' + (isSelected ? ' checked' : '') + ' />';
        html += '<span class="item-text">' + escapeHtml(text) + '</span>';
        html += '<div class="item-actions">';
        if (showUpgrade) {
            html += '<button class="btn-upgrade-item" data-text="' + escapeHtml(text) + '" title="升级为核心记忆"><i class="fas fa-arrow-up"></i></button>';
        }
        html += '<button class="btn-del-item" data-text="' + escapeHtml(text) + '" title="删除"><i class="fas fa-times"></i></button>';
        html += '</div>';
        html += '</div>';
    });

    html += '</div></div>';
    return html;
}

function bindMemoryEvents(role) {
    // 搜索
    var searchInput = document.getElementById('memorySearchInput');
    var searchClear = document.getElementById('memorySearchClear');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            memorySearchKeyword = this.value;
            if (searchClear) searchClear.classList.toggle('show', !!memorySearchKeyword);
            selectedMemories = [];
            renderMemory(role);
        });
    }
    if (searchClear) {
        searchClear.addEventListener('click', function() {
            memorySearchKeyword = '';
            selectedMemories = [];
            renderMemory(role);
        });
    }

    // 批量模式切换
    var batchToggle = document.getElementById('batchToggleBtn');
    if (batchToggle) {
        batchToggle.addEventListener('click', function() {
            batchMode = !batchMode;
            selectedMemories = [];
            renderMemory(role);
        });
    }

    // 折叠
    document.querySelectorAll('.cat-header').forEach(function(header) {
        header.addEventListener('click', function(e) {
            if (e.target.closest('.cat-checkbox')) return;
            var catId = this.dataset.catId;
            if (catId && categoryStates[catId] !== undefined) {
                categoryStates[catId] = !categoryStates[catId];
                var body = this.nextElementSibling;
                var arrow = this.querySelector('.cat-arrow');
                if (body) body.classList.toggle('collapsed');
                if (arrow) arrow.classList.toggle('open');
            }
        });
    });

    // 分类全选
    document.querySelectorAll('.cat-checkbox').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var catId = this.dataset.catId;
            var isChecked = this.checked;
            var items = document.querySelectorAll('.mem-item[data-cat="' + catId + '"] .item-checkbox');
            items.forEach(function(itemCb) {
                itemCb.checked = isChecked;
                itemCb.dispatchEvent(new Event('change'));
            });
        });
    });

    // 单项选择
    document.querySelectorAll('.item-checkbox').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var text = this.dataset.text;
            if (this.checked) {
                if (selectedMemories.indexOf(text) === -1) selectedMemories.push(text);
            } else {
                var idx = selectedMemories.indexOf(text);
                if (idx !== -1) selectedMemories.splice(idx, 1);
            }
            var catId = this.dataset.catId;
            var items = document.querySelectorAll('.mem-item[data-cat="' + catId + '"] .item-checkbox');
            var checked = document.querySelectorAll('.mem-item[data-cat="' + catId + '"] .item-checkbox:checked');
            var catCb = document.querySelector('.cat-checkbox[data-cat-id="' + catId + '"]');
            if (catCb) catCb.checked = items.length > 0 && checked.length === items.length;
            updateBatchActions();
        });
    });

    // 批量升级
    var batchUpgradeBtn = document.getElementById('batchUpgradeBtn');
    if (batchUpgradeBtn) {
        batchUpgradeBtn.addEventListener('click', function() {
            if (selectedMemories.length === 0) return;
            showConfirm('批量升级', '确定要将选中的 ' + selectedMemories.length + ' 条记忆升级为「核心记忆」吗？', function() {
                var upgraded = 0;
                if (role.memory) {
                    role.memory.forEach(function(m) {
                        if (selectedMemories.indexOf(getMemoryText(m)) !== -1 && m.level !== 'core') {
                            m.level = 'core';
                            upgraded++;
                        }
                    });
                }
                saveData();
                selectedMemories = [];
                renderMemory(role);
                renderRelationCard(role);
                showToast('✅ 已升级 ' + upgraded + ' 条');
            });
        });
    }

    // 批量删除
    var batchDeleteBtn = document.getElementById('batchDeleteBtn');
    if (batchDeleteBtn) {
        batchDeleteBtn.addEventListener('click', function() {
            if (selectedMemories.length === 0) return;
            showConfirm('批量删除', '确定要删除选中的 ' + selectedMemories.length + ' 条记忆吗？此操作不可恢复！', function() {
                var count = selectedMemories.length;
                if (role.memory) {
                    role.memory = role.memory.filter(function(m) {
                        return selectedMemories.indexOf(getMemoryText(m)) === -1;
                    });
                }
                saveData();
                selectedMemories = [];
                renderMemory(role);
                renderRelationCard(role);
                showToast('🗑️ 已删除 ' + count + ' 条');
            });
        });
    }

    // 单条升级
    document.querySelectorAll('.btn-upgrade-item').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var text = this.dataset.text;
            if (role.memory) {
                var found = role.memory.find(function(m) {
                    return getMemoryText(m) === text && m.level !== 'core';
                });
                if (found) {
                    found.level = 'core';
                    saveData();
                    renderMemory(role);
                    renderRelationCard(role);
                    showToast('✅ 已升级为核心记忆');
                }
            }
        });
    });

    // 单条删除
    document.querySelectorAll('.btn-del-item').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var text = this.dataset.text;
            showConfirm('删除记忆', '确定要删除这条记忆吗？', function() {
                if (role.memory) {
                    var idx = role.memory.findIndex(function(m) {
                        return getMemoryText(m) === text;
                    });
                    if (idx !== -1) {
                        role.memory.splice(idx, 1);
                        saveData();
                        renderMemory(role);
                        renderRelationCard(role);
                        showToast('✅ 已删除');
                    }
                }
            });
        });
    });

    // 添加
    var addInput = document.getElementById('memoryAddInput');
    var addBtn = document.getElementById('memoryAddBtn');

    function handleAddMemory() {
        if (isAddingMemory) return;
        var text = addInput ? addInput.value.trim() : '';
        if (!text) { showToast('⚠️ 请输入记忆内容'); return; }

        if (role.memory) {
            var duplicate = role.memory.some(function(m) {
                return getMemoryText(m) === text;
            });
            if (duplicate) {
                showToast('⚠️ 已存在相同记忆');
                if (addInput) addInput.value = '';
                return;
            }
        }

        isAddingMemory = true;
        if (addBtn) addBtn.disabled = true;
        if (!Array.isArray(role.memory)) role.memory = [];
        role.memory.push({ text: text, level: 'core', timestamp: Date.now() });
        saveData();
        if (addInput) addInput.value = '';
        memorySearchKeyword = '';
        selectedMemories = [];
        renderMemory(role);
        renderRelationCard(role);
        showToast('🧠 已添加核心记忆');
        isAddingMemory = false;
        if (addBtn) addBtn.disabled = false;
        if (addInput) addInput.focus();
    }

    if (addBtn) addBtn.addEventListener('click', handleAddMemory);
    if (addInput) {
        addInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); handleAddMemory(); }
        });
    }
}

function updateBatchActions() {
    var countEl = document.getElementById('selectedCount');
    if (countEl) countEl.textContent = selectedMemories.length;
}

// ========== 确认弹窗 ==========
function showConfirm(title, message, callback) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    document.getElementById('confirmOverlay').classList.add('active');
    confirmCallback = callback;
}

document.getElementById('confirmBtn').addEventListener('click', function() {
    document.getElementById('confirmOverlay').classList.remove('active');
    if (confirmCallback) { confirmCallback(); confirmCallback = null; }
});

document.getElementById('cancelBtn').addEventListener('click', function() {
    document.getElementById('confirmOverlay').classList.remove('active');
    confirmCallback = null;
});

document.getElementById('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) {
        this.classList.remove('active');
        confirmCallback = null;
    }
});

// ========== 主渲染 ==========
function renderAll() {
    var role = getCurrentRole();
    if (!role) {
        ['panelSummary', 'panelMemory'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>未找到角色</p></div>';
        });
        return;
    }

    renderRelationCard(role);

    if (currentTab === 'summary') renderSummary(role);
    else if (currentTab === 'memory') renderMemory(role);
}

// ========== Tab 切换 ==========
function setupTabs() {
    document.querySelectorAll('.memory-tab').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.memory-tab').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            currentTab = this.dataset.tab;

            document.querySelectorAll('.memory-panel').forEach(function(p) { p.classList.remove('active'); });
            var panelId = 'panel' + this.dataset.tab.charAt(0).toUpperCase() + this.dataset.tab.slice(1);
            var panel = document.getElementById(panelId);
            if (panel) panel.classList.add('active');

            var role = getCurrentRole();
            if (currentTab === 'summary') renderSummary(role);
            else if (currentTab === 'memory') {
                selectedMemories = [];
                renderMemory(role);
            }
        });
    });
}

// ========== 返回主应用 ==========
function goBack() {
    var frame = document.querySelector('.phone-frame');
    if (frame) {
        frame.classList.add('page-leaving');
        setTimeout(function() { window.location.href = 'index.html'; }, 350);
    } else {
        window.location.href = 'index.html';
    }
}

// ========== 刷新 ==========
function refreshData() {
    var btn = document.getElementById('refreshBtn');
    if (btn) {
        btn.style.transition = 'transform 0.6s ease';
        btn.style.transform = 'rotate(360deg)';
        setTimeout(function() { btn.style.transform = 'rotate(0deg)'; }, 650);
    }
    loadData().then(function(ok) {
        if (!ok) return;
        renderRoleStrip();
        selectedMemories = [];
        memorySearchKeyword = '';
        renderAll();
        showToast('🔄 已刷新');
    });
}

// ========== 隐藏加载动画 ==========
function hideLoader() {
    var overlay = document.getElementById('loaderOverlay');
    if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(function() { overlay.style.display = 'none'; }, 600);
    }
}

// ========== 初始化 ==========
function init() {
    console.log('📦 时光胶囊 v2.0 初始化中...');

    loadData().then(function(ok) {
        if (ok) {
            renderRoleStrip();
            setupTabs();
            renderAll();

            document.getElementById('backBtn').addEventListener('click', goBack);
            document.getElementById('refreshBtn').addEventListener('click', refreshData);

            // 监听 storage 变化
            window.addEventListener('storage', function(e) {
                if (e.key === 'ds_multirole_v2') {
                    console.log('📦 检测到数据变化，刷新中...');
                    loadData().then(function(ok2) {
                        if (ok2) {
                            renderRoleStrip();
                            renderAll();
                        }
                    });
                }
            });

            console.log('📦 时光胶囊 v2.0 已加载，共 ' + roles.length + ' 个角色');
        } else {
            var ps = document.getElementById('panelSummary');
            if (ps) {
                ps.innerHTML = '<div class="empty-state"><i class="fas fa-database"></i><p>请先打开主应用</p><span class="empty-hint">在「梦女空间」中创建角色后，再来这里查看</span></div>';
            }
        }
        setTimeout(hideLoader, 800);
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
