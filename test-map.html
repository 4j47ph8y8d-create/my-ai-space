<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园系统 - 全屏视图</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #12101a;
            overflow: hidden; /* 禁止滑动，全屏沉浸 */
            touch-action: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* 像素边缘锐利 */
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // 动态设置画布尺寸为手机屏幕大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const tileset = new Image();
        // 确保路径正确
        tileset.src = 'assets/furniture/kenney_indoor.png'; 

        const TILE_SIZE = 16;
        const MARGIN = 1;
        const SCALE = 3; // 放大3倍，这样在手机上看刚刚好
        const DRAW_SIZE = TILE_SIZE * SCALE;

        function getTilePos(col, row) {
            return { x: col * (TILE_SIZE + MARGIN), y: row * (TILE_SIZE + MARGIN) };
        }

        function drawTile(col, row, x, y) {
            const pos = getTilePos(col, row);
            ctx.drawImage(
                tileset, 
                pos.x, pos.y, TILE_SIZE, TILE_SIZE, 
                x, y, DRAW_SIZE, DRAW_SIZE
            );
        }

        tileset.onload = () => {
            // 1. 填充整个屏幕为底色（防止边缘露黑）
            ctx.fillStyle = '#cda87b'; // 木头色
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画地板网格线（视觉参考）
            ctx.strokeStyle = 'rgba(139, 90, 43, 0.15)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=DRAW_SIZE) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // 2. 画墙壁（盲猜坐标：row=11, col=3）
            // 我们沿着屏幕边缘画一圈墙
            const wallCol = 3, wallRow = 11;

            // 上边墙
            for (let x = 0; x < canvas.width; x += DRAW_SIZE) {
                drawTile(wallCol, wallRow, x, 0);
            }
            // 下边墙
            for (let x = 0; x < canvas.width; x += DRAW_SIZE) {
                drawTile(wallCol, wallRow, x, canvas.height - DRAW_SIZE);
            }
            // 左边墙
            for (let y = DRAW_SIZE; y < canvas.height - DRAW_SIZE; y += DRAW_SIZE) {
                drawTile(wallCol, wallRow, 0, y);
            }
            // 右边墙
            for (let y = DRAW_SIZE; y < canvas.height - DRAW_SIZE; y += DRAW_SIZE) {
                drawTile(wallCol, wallRow, canvas.width - DRAW_SIZE, y);
            }

            // 3. 测试放几个家具（坐标依然是猜的，只是为了展示比例）
            // 床
            drawTile(4, 1, DRAW_SIZE * 2, DRAW_SIZE * 2); 
            // 钢琴
            drawTile(18, 1, DRAW_SIZE * 7, DRAW_SIZE * 2); 
            // 桌子
            drawTile(12, 4, DRAW_SIZE * 4, DRAW_SIZE * 6); 
        };
    </script>
</body>
</html>
