<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园系统 - 地图编辑器</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; display: flex; flex-direction: column; }
        canvas { display: block; image-rendering: pixelated; }
        #toolbar { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 10px; }
        button { padding: 5px 10px; background: #333; color: #fff; border: 2px solid #555; border-radius: 5px; font-family: monospace; font-size: 16px; }
        button.active { background: #ff2a6d; border-color: #fff; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="btnFloor" class="active" onclick="setMode(1)">铺地板</button>
        <button id="btnWall" onclick="setMode(0)">画墙壁</button>
        <button onclick="saveMap()">保存并游玩</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const TILE_SIZE = 32;
        const MAP_COLS = Math.ceil(canvas.width / TILE_SIZE);
        const MAP_ROWS = Math.ceil(canvas.height / TILE_SIZE);

        // 0: 墙壁, 1: 地板
        let mapData = Array(MAP_ROWS).fill(null).map(() => Array(MAP_COLS).fill(1));
        let currentMode = 1; // 默认铺地板
        let isGameMode = false;

        // 加载素材
        const imgFloor = new Image(); imgFloor.src = 'assets/furniture/tile_floor_wood.png?v=101';
        const imgWallpaper = new Image(); imgWallpaper.src = 'assets/furniture/tile_wall_basic.png?v=101';
        const imgBaseboard = new Image(); imgBaseboard.src = 'assets/furniture/tile_wall_baseboard.png?v=101';

        // 小人
        const CHAR_WIDTH = 32; const CHAR_HEIGHT = 64;
        let facing = 'down'; let animFrame = 1; let animTimer = 0;
        const ANIM_SPEED = 100; let lastTime = 0; let isMoving = false; 
        const playerImages = {};
        ['down','up','left','right'].forEach(d => {
            for (let i = 1; i <= 4; i++) {
                let img = new Image(); img.src = `assets/avatar/chibi_male_walk_${d}_${i}.png?v=101`;
                playerImages[`${d}_${i}`] = img;
            }
        });

        let playerX = 5 * TILE_SIZE; let playerY = 5 * TILE_SIZE; let playerSpeed = 4;
        let cameraX = 0; let cameraY = 0;

        // --- 画笔功能 ---
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnFloor').classList.remove('active');
            document.getElementById('btnWall').classList.remove('active');
            if(mode === 1) document.getElementById('btnFloor').classList.add('active');
            if(mode === 0) document.getElementById('btnWall').classList.add('active');
        }

        let isDrawing = false;
        canvas.addEventListener('touchstart', (e) => {
            if (isGameMode) return;
            isDrawing = true;
            paintTile(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (isGameMode || !isDrawing) return;
            paintTile(e);
        });
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        function paintTile(e) {
            let rect = canvas.getBoundingClientRect();
            let touch = e.touches[0];
            let x = touch.clientX - rect.left;
            let y = touch.clientY - rect.top;

            let c = Math.floor(x / TILE_SIZE);
            let r = Math.floor(y / TILE_SIZE);

            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
                mapData[r][c] = currentMode;
                render(); // 实时重绘
            }
        }

        // --- 游玩模式 ---
        function saveMap() {
            isGameMode = true;
            document.getElementById('toolbar').style.display = 'none';
            // 找一块空地把小人放进去
            playerX = 5 * TILE_SIZE; playerY = 5 * TILE_SIZE;
            
            // 开启摇杆控制（移动逻辑写在下面）
            initMoveControls();
            render();
        }

        // --- 渲染 ---
        function render(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime; lastTime = timestamp;

            if (isGameMode && isMoving) {
                animTimer += dt;
                if (animTimer > ANIM_SPEED) { animTimer = 0; animFrame++; if (animFrame > 4) animFrame = 1; }
            } else { animFrame = 1; }

            ctx.fillStyle = '#12101a'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isGameMode) {
                cameraX = playerX - canvas.width / 2 + TILE_SIZE / 2;
                cameraY = playerY - canvas.height / 2 + TILE_SIZE / 2;
            } else {
                cameraX = 0; cameraY = 0; // 编辑模式不移动镜头
            }

            // 画地图
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    let sx = Math.floor(c * TILE_SIZE - cameraX);
                    let sy = Math.floor(r * TILE_SIZE - cameraY);
                    
                    if (mapData[r][c] === 1) {
                        if (imgFloor.complete) ctx.drawImage(imgFloor, sx, sy, TILE_SIZE, TILE_SIZE);
                    } else {
                        if (imgWallpaper.complete) ctx.drawImage(imgWallpaper, sx, sy, TILE_SIZE, TILE_SIZE);
                        // 如果下面是地板，加踢脚线
                        if (r+1 < MAP_ROWS && mapData[r+1][c] === 1) {
                            if (imgBaseboard.complete) ctx.drawImage(imgBaseboard, 0, 8, 16, 8, sx, sy + 16, TILE_SIZE, 16);
                        }
                    }
                }
            }

            // 画小人
            if (isGameMode) {
                const psx = playerX - cameraX; const psy = playerY - cameraY;
                let curImg = playerImages[`${facing}_${animFrame}`];
                if (curImg && curImg.complete) {
                    const rw = TILE_SIZE; const rh = CHAR_HEIGHT * (TILE_SIZE / CHAR_WIDTH);
                    ctx.drawImage(curImg, psx - (rw - TILE_SIZE)/2, psy - (rh - TILE_SIZE), rw, rh);
                }
            }

            requestAnimationFrame(render);
        }

        // 游玩模式的控制
        function initMoveControls() {
            let touchStartX = 0; let touchStartY = 0; let dragging = false;

            canvas.addEventListener('touchstart', (e) => {
                if (!isGameMode) return;
                touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
                dragging = true; isMoving = true;
            });

            canvas.addEventListener('touchmove', (e) => {
                if (!isGameMode || !dragging) return;
                let cx = e.touches[0].clientX; let cy = e.touches[0].clientY;
                let dx = cx - touchStartX; let dy = cy - touchStartY;
                
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    let nx = playerX; let ny = playerY;
                    if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0) { nx += playerSpeed; facing = 'right'; } else { nx -= playerSpeed; facing = 'left'; } }
                    else { if (dy > 0) { ny += playerSpeed; facing = 'down'; } else { ny -= playerSpeed; facing = 'up'; } }
                    
                    let gc = Math.floor((nx + 16) / TILE_SIZE); let gr = Math.floor((ny + 32) / TILE_SIZE);
                    if (gr >= 0 && gr < MAP_ROWS && gc >= 0 && gc < MAP_COLS) {
                        if (mapData[gr][gc] === 1) {
                            playerX = nx; playerY = ny;
                        }
                    }
                    touchStartX = cx; touchStartY = cy;
                }
            });

            canvas.addEventListener('touchend', () => {
                if (!isGameMode) return;
                dragging = false; isMoving = false;
            });
        }

        // 预加载图片完成后启动
        imgFloor.onload = () => render();
    </script>
</body>
</html>
