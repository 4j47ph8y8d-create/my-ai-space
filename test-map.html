<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园系统 - 角色行走测试</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const tileset = new Image();
        tileset.src = 'assets/furniture/kenney_indoor.png'; 

        const TILE_SIZE = 16;
        const MARGIN = 1;
        const SCALE = 2; 
        const DRAW_SIZE = TILE_SIZE * SCALE;

        const MAP_COLS = 30;
        const MAP_ROWS = 30;
        const WORLD_WIDTH = MAP_COLS * DRAW_SIZE;
        const WORLD_HEIGHT = MAP_ROWS * DRAW_SIZE;

        let cameraX = 0;
        let cameraY = 0;

        let playerX = 15 * DRAW_SIZE;
        let playerY = 15 * DRAW_SIZE;
        let playerSpeed = 4;

        // ==================== 角色动画系统 ====================
        // 根据你的截图，小人应该是 32x64 (或者类似比例)
        const CHAR_WIDTH = 32; 
        const CHAR_HEIGHT = 64;

        let facing = 'down'; 
        let animFrame = 1;   
        let animTimer = 0;   
        const ANIM_SPEED = 150; // 每一帧停留 150 毫秒
        let lastTime = 0;
        let isMoving = false; // 是否正在行走

        const playerImages = {};
        const dirs = ['down', 'up', 'left', 'right'];
        // 【关键修复】：加了 ?v=2 强制刷新浏览器的旧图片缓存！
        for (let d of dirs) {
            for (let i = 1; i <= 4; i++) {
                let img = new Image();
                img.src = `assets/avatar/chibi_male_walk_${d}_${i}.png?v=2`;
                playerImages[`${d}_${i}`] = img;
            }
        }

        function getTilePos(col, row) {
            return { x: col * (TILE_SIZE + MARGIN), y: row * (TILE_SIZE + MARGIN) };
        }

        function drawTile(col, row, screenX, screenY) {
            const pos = getTilePos(col, row);
            ctx.drawImage(tileset, pos.x, pos.y, TILE_SIZE, TILE_SIZE, screenX, screenY, DRAW_SIZE, DRAW_SIZE);
        }

        const WALL_COL = 3, WALL_ROW = 11;

        // 计算小人的缩放尺寸
        // 因为你要对齐格子，小人的宽度应该差不多等于格子宽度(DRAW_SIZE)
        // 高度按比例缩放
        const RENDER_WIDTH = DRAW_SIZE;
        const RENDER_HEIGHT = CHAR_HEIGHT * (DRAW_SIZE / CHAR_WIDTH);

        function render(timestamp) {
            // 动画计时器
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isMoving) {
                animTimer += dt;
                if (animTimer > ANIM_SPEED) {
                    animTimer = 0;
                    animFrame++;
                    if (animFrame > 4) animFrame = 1;
                }
            } else {
                animFrame = 1; // 停下时恢复第一帧
            }

            ctx.fillStyle = '#12101a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 摄像机边界限制
            cameraX = playerX - canvas.width / 2 + DRAW_SIZE / 2;
            cameraY = playerY - canvas.height / 2 + DRAW_SIZE / 2;

            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
            if (cameraY < 0) cameraY = 0;
            if (cameraY > WORLD_HEIGHT - canvas.height) cameraY = WORLD_HEIGHT - canvas.height;

            let startCol = Math.floor(cameraX / DRAW_SIZE);
            let endCol = Math.ceil((cameraX + canvas.width) / DRAW_SIZE);
            let startRow = Math.floor(cameraY / DRAW_SIZE);
            let endRow = Math.ceil((cameraY + canvas.height) / DRAW_SIZE);

            startCol = Math.max(0, startCol); endCol = Math.min(MAP_COLS, endCol);
            startRow = Math.max(0, startRow); endRow = Math.min(MAP_ROWS, endRow);

            // 绘制地图
            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    let screenX = c * DRAW_SIZE - cameraX;
                    let screenY = r * DRAW_SIZE - cameraY;

                    if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
                        drawTile(WALL_COL, WALL_ROW, screenX, screenY);
                    } else {
                        ctx.fillStyle = '#d2a679'; 
                        ctx.fillRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                        ctx.strokeStyle = 'rgba(139, 90, 43, 0.2)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                    }
                }
            }

            // 绘制小人
            const playerScreenX = playerX - cameraX;
            const playerScreenY = playerY - cameraY;

            let currentImg = playerImages[`${facing}_${animFrame}`];
            
            if (currentImg && currentImg.complete) {
                // 【关键修复】：脚底锚点对齐。
                // 格子底部对齐小人的脚底，防止人物悬空。
                // 因为小人比格子高，往上画一点。
                let drawOffsetY = DRAW_SIZE - RENDER_HEIGHT + 10; // +10 是一点点微调
                let drawOffsetX = (DRAW_SIZE - RENDER_WIDTH) / 2; // X轴居中

                // 如果小人太大，可以稍微缩小一点点
                // ctx.drawImage(currentImg, playerScreenX + drawOffsetX, playerScreenY + drawOffsetY, RENDER_WIDTH, RENDER_HEIGHT);

                // 放大两倍绘制，并做居中偏移
                const drawW = RENDER_WIDTH * 1.5; 
                const drawH = RENDER_HEIGHT * 1.5;
                const centerOffsetX = (drawW - DRAW_SIZE) / 2;
                const centerOffsetY = drawH - DRAW_SIZE;

                ctx.drawImage(
                    currentImg, 
                    playerScreenX - centerOffsetX, 
                    playerScreenY - centerOffsetY, 
                    drawW, 
                    drawH
                );
            }

            requestAnimationFrame(render);
        }

        // ==================== 触摸控制 ====================
        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
            isMoving = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let dx = currentX - touchStartX;
            let dy = currentY - touchStartY;

            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) { playerX += playerSpeed; facing = 'right'; }
                    else { playerX -= playerSpeed; facing = 'left'; }
                } else {
                    if (dy > 0) { playerY += playerSpeed; facing = 'down'; }
                    else { playerY -= playerSpeed; facing = 'up'; }
                }
                
                touchStartX = currentX;
                touchStartY = currentY;
            }

            // 空气墙限制
            const MIN_X = DRAW_SIZE;
            const MAX_X = WORLD_WIDTH - DRAW_SIZE * 2;
            const MIN_Y = DRAW_SIZE;
            const MAX_Y = WORLD_HEIGHT - DRAW_SIZE * 2;

            if (playerX < MIN_X) playerX = MIN_X;
            if (playerX > MAX_X) playerX = MAX_X;
            if (playerY < MIN_Y) playerY = MIN_Y;
            if (playerY > MAX_Y) playerY = MAX_Y;
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            isMoving = false; // 停止动画
        });

        tileset.onload = () => {
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>
