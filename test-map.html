<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园测试 - 经典房型</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ==================== 加载你自己画的素材 ====================
        const tileFloorWood = new Image(); tileFloorWood.src = 'assets/furniture/tile_floor_wood.png';
        const tileFloorStone = new Image(); tileFloorStone.src = 'assets/furniture/tile_floor_stone2.png';
        const tileWall = new Image(); tileWall.src = 'assets/furniture/tile_wall_basic.png';
        const tileBaseboard = new Image(); tileBaseboard.src = 'assets/furniture/tile_wall_baseboard.png';

        const TILE_SIZE = 32; // 你的新素材尺寸是 32x32
        const MAP_COLS = 25;
        const MAP_ROWS = 20;

        let cameraX = 0;
        let cameraY = 0;

        // 玩家坐标
        let playerX = 10 * TILE_SIZE;
        let playerY = 10 * TILE_SIZE;
        let playerSpeed = 4;

        // 小人素材加载
        const CHAR_WIDTH = 32; 
        const CHAR_HEIGHT = 64;
        let facing = 'down'; 
        let animFrame = 1;   
        let animTimer = 0;   
        const ANIM_SPEED = 100; 
        let lastTime = 0;
        let isMoving = false; 

        const playerImages = {};
        const dirs = ['down', 'up', 'left', 'right'];
        for (let d of dirs) {
            for (let i = 1; i <= 4; i++) {
                let img = new Image();
                // 加个 v=4 防止缓存
                img.src = `assets/avatar/chibi_male_walk_${d}_${i}.png?v=4`;
                playerImages[`${d}_${i}`] = img;
            }
        }

        // ==================== 绘制地图 ====================
        function drawTile(img, screenX, screenY) {
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, screenX, screenY, TILE_SIZE, TILE_SIZE);
            } else {
                // 如果图片没加载出来，先画个色块占位
                ctx.fillStyle = '#555';
                ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            }
        }

        function render(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isMoving) {
                animTimer += dt;
                if (animTimer > ANIM_SPEED) {
                    animTimer = 0;
                    animFrame++;
                    if (animFrame > 4) animFrame = 1;
                }
            } else {
                animFrame = 1;
            }

            ctx.fillStyle = '#12101a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 摄像机计算
            cameraX = playerX - canvas.width / 2 + TILE_SIZE / 2;
            cameraY = playerY - canvas.height / 2 + TILE_SIZE / 2;

            // 边界限制
            const WORLD_WIDTH = MAP_COLS * TILE_SIZE;
            const WORLD_HEIGHT = MAP_ROWS * TILE_SIZE;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
            if (cameraY < 0) cameraY = 0;
            if (cameraY > WORLD_HEIGHT - canvas.height) cameraY = WORLD_HEIGHT - canvas.height;

            let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
            let endCol = Math.min(MAP_COLS, Math.ceil((cameraX + canvas.width) / TILE_SIZE));
            let startRow = Math.max(0, Math.floor(cameraY / TILE_SIZE));
            let endRow = Math.min(MAP_ROWS, Math.ceil((cameraY + canvas.height) / TILE_SIZE));

            // 核心：绘制房型
            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    let screenX = c * TILE_SIZE - cameraX;
                    let screenY = r * TILE_SIZE - cameraY;

                    if (r < 3) {
                        // 上方三排：墙壁 + 踢脚线
                        if (r < 2) {
                            drawTile(tileWall, screenX, screenY);
                        } else {
                            drawTile(tileBaseboard, screenX, screenY);
                        }
                    } else if (r === MAP_ROWS - 1) {
                        // 最下方一排：墙壁（或者可以作为门的位置）
                        drawTile(tileWall, screenX, screenY);
                    } else if (c === 0 || c === MAP_COLS - 1) {
                        // 左右边缘：墙壁
                        drawTile(tileWall, screenX, screenY);
                    } else {
                        // 中间大面积：木地板
                        drawTile(tileFloorWood, screenX, screenY);
                    }
                }
            }

            // 绘制小人
            const playerScreenX = playerX - cameraX;
            const playerScreenY = playerY - cameraY;
            let currentImg = playerImages[`${facing}_${animFrame}`];
            
            if (currentImg && currentImg.complete) {
                const RENDER_WIDTH = TILE_SIZE;
                const RENDER_HEIGHT = CHAR_HEIGHT * (TILE_SIZE / CHAR_WIDTH);
                const centerOffsetX = (RENDER_WIDTH - TILE_SIZE) / 2;
                const centerOffsetY = RENDER_HEIGHT - TILE_SIZE;

                ctx.drawImage(
                    currentImg, 
                    playerScreenX - centerOffsetX, 
                    playerScreenY - centerOffsetY, 
                    RENDER_WIDTH, 
                    RENDER_HEIGHT
                );
            }

            requestAnimationFrame(render);
        }

        // ==================== 触摸控制 ====================
        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
            isMoving = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let dx = currentX - touchStartX;
            let dy = currentY - touchStartY;

            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) { playerX += playerSpeed; facing = 'right'; }
                    else { playerX -= playerSpeed; facing = 'left'; }
                } else {
                    if (dy > 0) { playerY += playerSpeed; facing = 'down'; }
                    else { playerY -= playerSpeed; facing = 'up'; }
                }
                touchStartX = currentX;
                touchStartY = currentY;
            }

            // 空气墙限制（卡在墙壁里面）
            const MIN_X = TILE_SIZE;
            const MAX_X = (MAP_COLS * TILE_SIZE) - TILE_SIZE * 2;
            const MIN_Y = TILE_SIZE * 3; // 上面有 3 排墙
            const MAX_Y = (MAP_ROWS * TILE_SIZE) - TILE_SIZE * 2;

            if (playerX < MIN_X) playerX = MIN_X;
            if (playerX > MAX_X) playerX = MAX_X;
            if (playerY < MIN_Y) playerY = MIN_Y;
            if (playerY > MAX_Y) playerY = MAX_Y;
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            isMoving = false;
        });

        requestAnimationFrame(render);
    </script>
</body>
</html>
