<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园 - 地图编辑器</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; font-family: monospace; }
        canvas { display: block; image-rendering: pixelated; }
        
        /* 顶部工具栏 */
        #toolbar { 
            position: absolute; top: 0; left: 0; width: 100%; 
            background: rgba(0,0,0,0.8); border-bottom: 2px solid #5c3a21;
            padding: 10px; display: flex; gap: 10px; overflow-x: auto; align-items: center;
            z-index: 10;
        }
        
        .btn {
            background: #333; color: #fff; border: 2px solid #555; 
            padding: 8px 12px; border-radius: 4px; font-size: 16px;
            white-space: nowrap;
        }
        .btn.active { background: #ff2a6d; border-color: #fff; box-shadow: 0 0 10px #ff2a6d; }
        
        .btn-play { background: #05d9e8; color: #000; border-color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="btn active" onclick="setTool('floor')">铺地板</button>
        <button class="btn" onclick="setTool('wall')">画墙纸(上)</button>
        <button class="btn" onclick="setTool('wall_left')">画墙纸(左)</button>
        <button class="btn" onclick="setTool('wall_right')">画墙纸(右)</button>
        <button class="btn" onclick="setTool('erase')">橡皮擦</button>
        <div style="flex:1;"></div>
        <button class="btn btn-play" onclick="togglePlay()">开始游玩</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        // 画布撑满屏幕
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const TILE_SIZE = 32;
        const MAP_COLS = 30; // 足够大的画布供你编辑
        const MAP_ROWS = 25;
        
        // 瓦片类型: 0=虚空, 1=地板, 2=上墙, 3=左墙, 4=右墙
        let mapData = Array(MAP_ROWS).fill(null).map(() => Array(MAP_COLS).fill(0));
        
        let currentTool = 'floor';
        let isPlaying = false;
        let isDrawing = false;

        // 加载图片素材
        const imgFloor = new Image(); imgFloor.src = 'assets/furniture/tile_floor_wood.png?v=200';
        const imgWallTop = new Image(); imgWallTop.src = 'assets/furniture/tile_wall_basic.png?v=200';
        const imgBaseboard = new Image(); imgBaseboard.src = 'assets/furniture/tile_wall_baseboard.png?v=200';
        // 假设你有左侧墙壁和右侧墙壁的图，如果没有，暂用上墙代替
        const imgWallLeft = new Image(); imgWallLeft.src = 'assets/furniture/tile_wall_basic.png?v=200';
        const imgWallRight = new Image(); imgWallRight.src = 'assets/furniture/tile_wall_basic.png?v=200';

        // 小人
        const CHAR_WIDTH = 32; const CHAR_HEIGHT = 64;
        let facing = 'down'; let animFrame = 1;
        const playerImages = {};
        ['down','up','left','right'].forEach(d => {
            for (let i = 1; i <= 4; i++) {
                let img = new Image(); img.src = `assets/avatar/chibi_male_walk_${d}_${i}.png?v=200`;
                playerImages[`${d}_${i}`] = img;
            }
        });

        let playerX = 5 * TILE_SIZE; let playerY = 5 * TILE_SIZE; 
        let cameraX = 0; let cameraY = 0;

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                document.getElementById('toolbar').style.display = 'none';
                // 给玩家找一个安全的位置出生
                for(let r=1; r<MAP_ROWS; r++){
                    for(let c=1; c<MAP_COLS; c++){
                        if(mapData[r][c] === 1) {
                            playerX = c * TILE_SIZE; playerY = r * TILE_SIZE; break;
                        }
                    }
                    if(playerX !== 5*TILE_SIZE) break;
                }
            } else {
                document.getElementById('toolbar').style.display = 'flex';
            }
            render();
        }

        // ==================== 画笔逻辑 ====================
        function handleDraw(clientX, clientY) {
            if (isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            let c = Math.floor(x / TILE_SIZE);
            let r = Math.floor(y / TILE_SIZE);

            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
                if (currentTool === 'floor') mapData[r][c] = 1;
                if (currentTool === 'wall') mapData[r][c] = 2;
                if (currentTool === 'wall_left') mapData[r][c] = 3;
                if (currentTool === 'wall_right') mapData[r][c] = 4;
                if (currentTool === 'erase') mapData[r][c] = 0;
                render();
            }
        }

        canvas.addEventListener('mousedown', e => { isDrawing = true; handleDraw(e.clientX, e.clientY); });
        canvas.addEventListener('mousemove', e => { if(isDrawing) handleDraw(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', e => { isDrawing = true; handleDraw(e.touches[0].clientX, e.touches[0].clientY); });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); if(isDrawing) handleDraw(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);

        // ==================== 渲染逻辑 ====================
        function render() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (isPlaying) {
                cameraX = playerX - canvas.width / 2 + TILE_SIZE / 2;
                cameraY = playerY - canvas.height / 2 + TILE_SIZE / 2;
            } else {
                cameraX = 0; cameraY = 0; // 编辑模式不移动镜头
            }

            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    let sx = Math.floor(c * TILE_SIZE - cameraX);
                    let sy = Math.floor(r * TILE_SIZE - cameraY);
                    let cell = mapData[r][c];

                    if (cell === 0) {
                        // 虚空背景
                        ctx.fillStyle = '#111'; ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                        continue; 
                    }

                    if (cell === 1) {
                        if (imgFloor.complete) ctx.drawImage(imgFloor, sx, sy, TILE_SIZE, TILE_SIZE);
                    } else if (cell === 2 || cell === 3 || cell === 4) {
                        // 先垫底图
                        if (cell === 2 && imgWallTop.complete) ctx.drawImage(imgWallTop, sx, sy, TILE_SIZE, TILE_SIZE);
                        if (cell === 3 && imgWallLeft.complete) ctx.drawImage(imgWallLeft, sx, sy, TILE_SIZE, TILE_SIZE);
                        if (cell === 4 && imgWallRight.complete) ctx.drawImage(imgWallRight, sx, sy, TILE_SIZE, TILE_SIZE);

                        // 自动加踢脚线（如果下面一格是地板）
                        if (r+1 < MAP_ROWS && mapData[r+1][c] === 1) {
                            if (imgBaseboard.complete) ctx.drawImage(imgBaseboard, 0, 8, 16, 8, sx, sy + 16, TILE_SIZE, 16);
                        }
                    }
                }
            }

            // 画小人
            if (isPlaying) {
                const psx = playerX - cameraX; const psy = playerY - cameraY;
                let curImg = playerImages[`${facing}_${animFrame}`];
                if (curImg && curImg.complete) {
                    const rw = TILE_SIZE; const rh = CHAR_HEIGHT * (TILE_SIZE / CHAR_WIDTH);
                    ctx.drawImage(curImg, psx - (rw - TILE_SIZE)/2, psy - (rh - TILE_SIZE), rw, rh);
                }
            }
        }

        // 动画循环
        function loop() {
            render();
            requestAnimationFrame(loop);
        }
        loop();

        // ==================== 游玩控制 ====================
        let tX = 0; let tY = 0; let dragging = false;
        canvas.addEventListener('touchstart', e => {
            if (!isPlaying) return;
            tX = e.touches[0].clientX; tY = e.touches[0].clientY; dragging = true;
        });
        canvas.addEventListener('touchmove', e => {
            if (!isPlaying || !dragging) return;
            let cx = e.touches[0].clientX; let cy = e.touches[0].clientY;
            let dx = cx - tX; let dy = cy - tY;
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                let nx = playerX; let ny = playerY;
                if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0) { nx += 4; facing = 'right'; } else { nx -= 4; facing = 'left'; } }
                else { if (dy > 0) { ny += 4; facing = 'down'; } else { ny -= 4; facing = 'up'; } }
                
                // 简单碰撞：只能走在地板上
                let gc = Math.floor((nx + 16) / TILE_SIZE); let gr = Math.floor((ny + 32) / TILE_SIZE);
                if (gr >= 0 && gr < MAP_ROWS && gc >= 0 && gc < MAP_COLS) {
                    if (mapData[gr][gc] === 1) {
                        playerX = nx; playerY = ny;
                    }
                }
                tX = cx; tY = cy;
            }
        });
        canvas.addEventListener('touchend', () => { dragging = false; });
    </script>
</body>
</html>
