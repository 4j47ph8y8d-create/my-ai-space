<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园 - 造梦空间</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; font-family: monospace; }
        canvas { display: block; image-rendering: pixelated; }
        
        /* 顶部建造工具栏 */
        #toolbar { 
            position: absolute; top: 0; left: 0; width: 100%; 
            background: rgba(0,0,0,0.85); border-bottom: 2px solid #5c3a21;
            padding: 10px; display: flex; gap: 8px; overflow-x: auto; align-items: center;
            z-index: 10; box-sizing: border-box; flex-wrap: wrap;
        }
        
        .btn {
            background: #333; color: #fff; border: 2px solid #555; 
            padding: 6px 10px; border-radius: 4px; font-size: 14px;
            white-space: nowrap; font-weight: bold;
        }
        .btn.active { background: #ff2a6d; border-color: #fff; box-shadow: 0 0 10px #ff2a6d; }
        .btn-play { background: #05d9e8; color: #000; border-color: #fff; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="btn active" onclick="setTool('floor')">铺地板</button>
        <button class="btn" onclick="setTool('wall_edge')">画外边缘墙</button>
        <button class="btn" onclick="setTool('wall_paper')">画墙纸(带踢脚线)</button>
        <button class="btn" onclick="setTool('erase')">橡皮擦</button>
        <div style="flex:1; min-width: 10px;"></div>
        <button class="btn btn-play" onclick="togglePlay()">进入游玩</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const TILE_SIZE = 32;
        // 我们给一个足够大的网格画布 (比如 30x30)
        const MAP_COLS = 30; 
        const MAP_ROWS = 30;

        // 0=虚空, 1=地板, 2=边缘墙, 3=墙纸
        let mapData = Array(MAP_ROWS).fill(null).map(() => Array(MAP_COLS).fill(0));
        
        let currentTool = 'floor';
        let isPlaying = false;
        let isDrawing = false;

        // 相机偏移 (用于游玩模式时居中)
        let cameraX = 0;
        let cameraY = 0;
        let playerX = 5 * TILE_SIZE;
        let playerY = 5 * TILE_SIZE;
        let playerSpeed = 4;
        let facing = 'down';

        // 加载素材 (加 v=888 防缓存)
        const imgs = {
            floor: new Image(),
            edge_top: new Image(), edge_bottom: new Image(), edge_left: new Image(), edge_right: new Image(),
            edge_tl: new Image(), edge_tr: new Image(), edge_bl: new Image(), edge_br: new Image(),
            wallpaper_dark: new Image(), wallpaper_base: new Image(),
            player: new Image()
        };

        imgs.floor.src = 'assets/furniture/floor_wood.png?v=888';
        imgs.edge_top.src = 'assets/furniture/edge_top.png?v=888';
        imgs.edge_bottom.src = 'assets/furniture/edge_bottom.png?v=888';
        imgs.edge_left.src = 'assets/furniture/edge_left.png?v=888';
        imgs.edge_right.src = 'assets/furniture/edge_right.png?v=888';
        imgs.edge_tl.src = 'assets/furniture/edge_top_left.png?v=888';
        imgs.edge_tr.src = 'assets/furniture/edge_top_right.png?v=888';
        imgs.edge_bl.src = 'assets/furniture/edge_bottom_left.png?v=888';
        imgs.edge_br.src = 'assets/furniture/edge_bottom_right.png?v=888';
        imgs.wallpaper_dark.src = 'assets/furniture/wallpaper_top_dark.png?v=888';
        imgs.wallpaper_base.src = 'assets/furniture/wallpaper_top_base.png?v=888';
        // 暂用之前的白模小人第一帧
        imgs.player.src = 'assets/avatar/chibi_male_walk_down_1.png?v=888';

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('toolbar').style.display = isPlaying ? 'none' : 'flex';
            
            if (isPlaying) {
                // 找一个地板位置放小人
                let found = false;
                for(let r=0; r<MAP_ROWS; r++){
                    for(let c=0; c<MAP_COLS; c++){
                        if(mapData[r][c] === 1) {
                            playerX = c * TILE_SIZE; playerY = r * TILE_SIZE; found = true; break;
                        }
                    }
                    if(found) break;
                }
            }
            render();
        }

        // ==================== 画笔逻辑 ====================
        function handleDraw(clientX, clientY) {
            if (isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            // 计算点击了哪个格子 (加上一些偏移，让画布居中一点，这里简化直接从头开始)
            let c = Math.floor(x / TILE_SIZE);
            let r = Math.floor(y / TILE_SIZE);

            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
                if (currentTool === 'floor') mapData[r][c] = 1;
                if (currentTool === 'wall_edge') mapData[r][c] = 2;
                if (currentTool === 'wall_paper') mapData[r][c] = 3;
                if (currentTool === 'erase') mapData[r][c] = 0;
                render();
            }
        }

        canvas.addEventListener('mousedown', e => { isDrawing = true; handleDraw(e.clientX, e.clientY); });
        canvas.addEventListener('mousemove', e => { if(isDrawing) handleDraw(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; handleDraw(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
        canvas.addEventListener('touchmove', e => { e.preventDefault(); if(isDrawing) handleDraw(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);

        // ==================== 渲染逻辑 ====================
        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 如果是游玩模式，相机跟随小人
            if (isPlaying) {
                cameraX = playerX - canvas.width / 2 + TILE_SIZE / 2;
                cameraY = playerY - canvas.height / 2 + TILE_SIZE / 2;
            } else {
                // 建造模式，画布从左上角开始
                cameraX = 0;
                cameraY = 0;
            }

            // 1. 渲染底层：地板
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    let sx = c * TILE_SIZE - cameraX;
                    let sy = r * TILE_SIZE - cameraY;
                    let cell = mapData[r][c];

                    // 画个编辑网格
                    if (!isPlaying) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                        ctx.strokeRect(sx, sy, TILE_SIZE, TILE_SIZE);
                    }

                    if (cell === 1 || cell === 2 || cell === 3) {
                        if (imgs.floor.complete) ctx.drawImage(imgs.floor, sx, sy, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // 2. 渲染中层：墙纸（带踢脚线）
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    let sx = c * TILE_SIZE - cameraX;
                    let sy = r * TILE_SIZE - cameraY;
                    if (mapData[r][c] === 3) {
                        // 墙纸叠加：上半截阴影 + 下半截踢脚线
                        if (imgs.wallpaper_dark.complete) ctx.drawImage(imgs.wallpaper_dark, sx, sy, TILE_SIZE, TILE_SIZE);
                        if (imgs.wallpaper_base.complete) ctx.drawImage(imgs.wallpaper_base, sx, sy, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // 3. 渲染顶层：智能边缘墙壁 (核心算法！)
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    if (mapData[r][c] === 2) {
                        let sx = c * TILE_SIZE - cameraX;
                        let sy = r * TILE_SIZE - cameraY;

                        // 寻找周围是不是自己人 (2)
                        let isTop = (r-1 < 0 || mapData[r-1][c] !== 2);
                        let isBottom = (r+1 >= MAP_ROWS || mapData[r+1][c] !== 2);
                        let isLeft = (c-1 < 0 || mapData[r][c-1] !== 2);
                        let isRight = (c+1 >= MAP_COLS || mapData[r][c+1] !== 2);

                        let outImg = null;
                        // 转角优先判定
                        if (isTop && isLeft) outImg = imgs.edge_tl;
                        else if (isTop && isRight) outImg = imgs.edge_tr;
                        else if (isBottom && isLeft) outImg = imgs.edge_bl;
                        else if (isBottom && isRight) outImg = imgs.edge_br;
                        // 然后是直边
                        else if (isTop) outImg = imgs.edge_top;
                        else if (isBottom) outImg = imgs.edge_bottom;
                        else if (isLeft) outImg = imgs.edge_left;
                        else if (isRight) outImg = imgs.edge_right;

                        if (outImg && outImg.complete) {
                            ctx.drawImage(outImg, sx, sy, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // 4. 渲染小人
            if (isPlaying) {
                const psx = playerX - cameraX; 
                const psy = playerY - cameraY;
                // 因为小人素材可能是 32x64，稍微调整一下 Y 轴让脚对齐
                if (imgs.player.complete) {
                    ctx.drawImage(imgs.player, psx, psy - 32, TILE_SIZE, 64);
                }
            }
        }

        // ==================== 游玩模式触摸控制 ====================
        let tX = 0; let tY = 0; let dragging = false;
        canvas.addEventListener('touchstart', e => {
            if (!isPlaying) return;
            tX = e.touches[0].clientX; tY = e.touches[0].clientY; dragging = true;
        });
        canvas.addEventListener('touchmove', e => {
            if (!isPlaying || !dragging) return;
            let cx = e.touches[0].clientX; let cy = e.touches[0].clientY;
            let dx = cx - tX; let dy = cy - tY;
            
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                let nx = playerX; let ny = playerY;
                if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0) nx += playerSpeed; else nx -= playerSpeed; }
                else { if (dy > 0) ny += playerSpeed; else ny -= playerSpeed; }
                
                // 碰撞检测：只能走在地板(1) 和 墙纸(3) 上 (墙纸可以走，因为我们贴在上墙，小人实际上在下方的地板)
                let gc = Math.floor((nx + 16) / TILE_SIZE); 
                let gr = Math.floor((ny + 32) / TILE_SIZE);
                
                if (gr >= 0 && gr < MAP_ROWS && gc >= 0 && gc < MAP_COLS) {
                    let targetCell = mapData[gr][gc];
                    if (targetCell === 1 || targetCell === 3) {
                        playerX = nx; playerY = ny;
                    }
                }
                tX = cx; tY = cy;
                render();
            }
        });
        canvas.addEventListener('touchend', () => { dragging = false; });

        // 窗口缩放适应
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        });

        render();
    </script>
</body>
</html>
