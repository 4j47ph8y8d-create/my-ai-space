<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园系统 - 摄像机跟随</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // 动态适应屏幕
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const tileset = new Image();
        // 请确保图片路径正确，根据你之前拉取的路径
        tileset.src = 'assets/furniture/kenney_indoor.png'; 

        const TILE_SIZE = 16;
        const MARGIN = 1;
        const SCALE = 3; // 放大3倍
        const DRAW_SIZE = TILE_SIZE * SCALE;

        // 地图大小：比如 30 x 30 的格子
        const MAP_COLS = 30;
        const MAP_ROWS = 30;

        // 摄像机坐标 (世界的左上角在屏幕上的偏移)
        let cameraX = 0;
        let cameraY = 0;

        // 小人的坐标 (在世界的网格里)
        let playerX = 15 * DRAW_SIZE;
        let playerY = 15 * DRAW_SIZE;
        let playerSpeed = 4;

        function getTilePos(col, row) {
            return { x: col * (TILE_SIZE + MARGIN), y: row * (TILE_SIZE + MARGIN) };
        }

        function drawTile(col, row, screenX, screenY) {
            const pos = getTilePos(col, row);
            ctx.drawImage(tileset, pos.x, pos.y, TILE_SIZE, TILE_SIZE, screenX, screenY, DRAW_SIZE, DRAW_SIZE);
        }

        // 这里的墙壁坐标也是咱们猜的，用 row 11, col 3 代表墙
        const WALL_COL = 3, WALL_ROW = 11;

        function render() {
            // 1. 清空屏幕
            ctx.fillStyle = '#12101a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 摄像机视角计算：让小人永远在屏幕正中间
            cameraX = playerX - canvas.width / 2 + DRAW_SIZE / 2;
            cameraY = playerY - canvas.height / 2 + DRAW_SIZE / 2;

            // 3. 只画屏幕里能看到的格子（性能优化）
            // 算出当前屏幕能看到的地图范围
            let startCol = Math.floor(cameraX / DRAW_SIZE);
            let endCol = Math.ceil((cameraX + canvas.width) / DRAW_SIZE);
            let startRow = Math.floor(cameraY / DRAW_SIZE);
            let endRow = Math.ceil((cameraY + canvas.height) / DRAW_SIZE);

            // 防止越界
            startCol = Math.max(0, startCol); endCol = Math.min(MAP_COLS, endCol);
            startRow = Math.max(0, startRow); endRow = Math.min(MAP_ROWS, endRow);

            // 4. 绘制地图
            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    let screenX = c * DRAW_SIZE - cameraX;
                    let screenY = r * DRAW_SIZE - cameraY;

                    // 判断是不是边缘的墙壁
                    if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
                        drawTile(WALL_COL, WALL_ROW, screenX, screenY);
                    } else {
                        // 如果是空地，画我们的木地板底色
                        ctx.fillStyle = '#d2a679'; // 木地板色
                        ctx.fillRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                        // 画一点网格线
                        ctx.strokeStyle = 'rgba(139, 90, 43, 0.2)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                    }
                }
            }

            // 5. 绘制一个测试的“小人” (先用一个红方块代替)
            const playerScreenX = playerX - cameraX;
            const playerScreenY = playerY - cameraY;
            
            ctx.fillStyle = '#ff2a6d'; // 亮粉色代表你
            ctx.fillRect(playerScreenX, playerScreenY, DRAW_SIZE, DRAW_SIZE);
            ctx.strokeStyle = '#fff'; // 白边
            ctx.lineWidth = 2;
            ctx.strokeRect(playerScreenX, playerScreenY, DRAW_SIZE, DRAW_SIZE);

            // 画一个十字星标在屏幕中心参考
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(canvas.width/2 - 1, canvas.height/2 - 10, 2, 20);
            ctx.fillRect(canvas.width/2 - 10, canvas.height/2 - 1, 20, 2);
        }

        // ==================== 控制逻辑 ====================
        // 这里为了测试，我们用触摸屏幕的上下左右来控制小人移动
        // 真正做的时候，这里会换成虚拟摇杆
        
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            let dx = e.touches[0].clientX - touchStartX;
            let dy = e.touches[0].clientY - touchStartY;

            // 判断手势方向
            if (Math.abs(dx) > Math.abs(dy)) {
                // 左右滑
                if (dx > 10) playerX += playerSpeed;
                else if (dx < -10) playerX -= playerSpeed;
            } else {
                // 上下滑
                if (dy > 10) playerY += playerSpeed;
                else if (dy < -10) playerY -= playerSpeed;
            }
        });

        // 游戏主循环
        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        // 当素材加载完后启动
        tileset.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
