<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园系统 - 角色行走测试</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const tileset = new Image();
        tileset.src = 'assets/furniture/kenney_indoor.png'; 

        const TILE_SIZE = 16;
        const MARGIN = 1;
        const SCALE = 2; 
        const DRAW_SIZE = TILE_SIZE * SCALE;

        const MAP_COLS = 30;
        const MAP_ROWS = 30;
        const WORLD_WIDTH = MAP_COLS * DRAW_SIZE;
        const WORLD_HEIGHT = MAP_ROWS * DRAW_SIZE;

        let cameraX = 0;
        let cameraY = 0;

        // 玩家坐标
        let playerX = 15 * DRAW_SIZE;
        let playerY = 15 * DRAW_SIZE;
        let playerSpeed = 4;

        // ==================== 角色动画系统 ====================
        // 假设你的小人画布是 32x64，如果不是，请改这里
        const CHAR_WIDTH = 32; 
        const CHAR_HEIGHT = 64;

        // 角色状态
        let facing = 'down'; // 当前朝向：down, up, left, right
        let animFrame = 1;   // 当前帧 (1~4)
        let animTimer = 0;   // 计时器
        const ANIM_SPEED = 8; // 每走几步切换一帧（数字越小动画越快）

        // 预加载所有角色图片
        const playerImages = {};
        const dirs = ['down', 'up', 'left', 'right'];
        for (let d of dirs) {
            for (let i = 1; i <= 4; i++) {
                let img = new Image();
                img.src = `assets/avatar/chibi_male_walk_${d}_${i}.png`;
                playerImages[`${d}_${i}`] = img;
            }
        }

        function getTilePos(col, row) {
            return { x: col * (TILE_SIZE + MARGIN), y: row * (TILE_SIZE + MARGIN) };
        }

        function drawTile(col, row, screenX, screenY) {
            const pos = getTilePos(col, row);
            ctx.drawImage(tileset, pos.x, pos.y, TILE_SIZE, TILE_SIZE, screenX, screenY, DRAW_SIZE, DRAW_SIZE);
        }

        const WALL_COL = 3, WALL_ROW = 11;

        function render() {
            ctx.fillStyle = '#12101a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 摄像机边界限制
            cameraX = playerX - canvas.width / 2 + DRAW_SIZE / 2;
            cameraY = playerY - canvas.height / 2 + DRAW_SIZE / 2;

            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
            if (cameraY < 0) cameraY = 0;
            if (cameraY > WORLD_HEIGHT - canvas.height) cameraY = WORLD_HEIGHT - canvas.height;

            // 2. 计算屏幕可见范围
            let startCol = Math.floor(cameraX / DRAW_SIZE);
            let endCol = Math.ceil((cameraX + canvas.width) / DRAW_SIZE);
            let startRow = Math.floor(cameraY / DRAW_SIZE);
            let endRow = Math.ceil((cameraY + canvas.height) / DRAW_SIZE);

            startCol = Math.max(0, startCol); endCol = Math.min(MAP_COLS, endCol);
            startRow = Math.max(0, startRow); endRow = Math.min(MAP_ROWS, endRow);

            // 3. 绘制地图
            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    let screenX = c * DRAW_SIZE - cameraX;
                    let screenY = r * DRAW_SIZE - cameraY;

                    if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
                        drawTile(WALL_COL, WALL_ROW, screenX, screenY);
                    } else {
                        ctx.fillStyle = '#d2a679'; 
                        ctx.fillRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                        ctx.strokeStyle = 'rgba(139, 90, 43, 0.2)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                    }
                }
            }

            // 4. 绘制小人
            const playerScreenX = playerX - cameraX;
            const playerScreenY = playerY - cameraY;

            // 获取当前应该显示的图片
            let currentImg = playerImages[`${facing}_${animFrame}`];
            
            if (currentImg && currentImg.complete) {
                // 计算小人的绘制偏移（让脚底对齐格子底部，因为小人比格子高）
                let drawOffsetY = DRAW_SIZE - (CHAR_HEIGHT * (DRAW_SIZE / CHAR_WIDTH));
                // 为了让小人居中，稍微调一下 X
                let drawOffsetX = (DRAW_SIZE - DRAW_SIZE) / 2; 

                ctx.drawImage(
                    currentImg, 
                    playerScreenX + drawOffsetX, 
                    playerScreenY + drawOffsetY, 
                    DRAW_SIZE, // 宽度设为格子宽
                    CHAR_HEIGHT * (DRAW_SIZE / CHAR_WIDTH) // 等比例缩放高度
                );
            }
        }

        // ==================== 触摸控制 ====================
        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;
        let stepCounter = 0; // 记录移动步数，用来切动画

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let dx = currentX - touchStartX;
            let dy = currentY - touchStartY;

            // 移动阈值
            if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                let moved = false;

                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) { playerX += playerSpeed; facing = 'right'; }
                    else { playerX -= playerSpeed; facing = 'left'; }
                } else {
                    if (dy > 0) { playerY += playerSpeed; facing = 'down'; }
                    else { playerY -= playerSpeed; facing = 'up'; }
                }
                
                touchStartX = currentX;
                touchStartY = currentY;
                moved = true;

                // === 动画切帧逻辑 ===
                if (moved) {
                    stepCounter++;
                    if (stepCounter >= ANIM_SPEED) {
                        stepCounter = 0;
                        animFrame++;
                        if (animFrame > 4) animFrame = 1; // 4帧循环
                    }
                }
            }

            // 空气墙限制
            const MIN_X = DRAW_SIZE;
            const MAX_X = WORLD_WIDTH - DRAW_SIZE * 2;
            const MIN_Y = DRAW_SIZE;
            const MAX_Y = WORLD_HEIGHT - DRAW_SIZE * 2;

            if (playerX < MIN_X) playerX = MIN_X;
            if (playerX > MAX_X) playerX = MAX_X;
            if (playerY < MIN_Y) playerY = MIN_Y;
            if (playerY > MAX_Y) playerY = MAX_Y;
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            animFrame = 1; // 停下时恢复到第一帧
        });

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        tileset.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
