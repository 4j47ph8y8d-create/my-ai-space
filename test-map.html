<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园系统 - 完美镜头与空气墙</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const tileset = new Image();
        tileset.src = 'assets/furniture/kenney_indoor.png'; 

        const TILE_SIZE = 16;
        const MARGIN = 1;
        const SCALE = 2; // 2倍视野
        const DRAW_SIZE = TILE_SIZE * SCALE;

        // 地图大小 30x30
        const MAP_COLS = 30;
        const MAP_ROWS = 30;
        const WORLD_WIDTH = MAP_COLS * DRAW_SIZE;
        const WORLD_HEIGHT = MAP_ROWS * DRAW_SIZE;

        let cameraX = 0;
        let cameraY = 0;

        // 小人初始化在地图中间
        let playerX = 15 * DRAW_SIZE;
        let playerY = 15 * DRAW_SIZE;
        let playerSpeed = 4;

        function getTilePos(col, row) {
            return { x: col * (TILE_SIZE + MARGIN), y: row * (TILE_SIZE + MARGIN) };
        }

        function drawTile(col, row, screenX, screenY) {
            const pos = getTilePos(col, row);
            ctx.drawImage(tileset, pos.x, pos.y, TILE_SIZE, TILE_SIZE, screenX, screenY, DRAW_SIZE, DRAW_SIZE);
        }

        const WALL_COL = 3, WALL_ROW = 11;

        function render() {
            ctx.fillStyle = '#12101a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 摄像机跟随并限制边界
            cameraX = playerX - canvas.width / 2 + DRAW_SIZE / 2;
            cameraY = playerY - canvas.height / 2 + DRAW_SIZE / 2;

            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
            if (cameraY < 0) cameraY = 0;
            if (cameraY > WORLD_HEIGHT - canvas.height) cameraY = WORLD_HEIGHT - canvas.height;

            // 2. 计算当前屏幕能看到的格子范围
            let startCol = Math.floor(cameraX / DRAW_SIZE);
            let endCol = Math.ceil((cameraX + canvas.width) / DRAW_SIZE);
            let startRow = Math.floor(cameraY / DRAW_SIZE);
            let endRow = Math.ceil((cameraY + canvas.height) / DRAW_SIZE);

            startCol = Math.max(0, startCol); endCol = Math.min(MAP_COLS, endCol);
            startRow = Math.max(0, startRow); endRow = Math.min(MAP_ROWS, endRow);

            // 3. 绘制地图
            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    let screenX = c * DRAW_SIZE - cameraX;
                    let screenY = r * DRAW_SIZE - cameraY;

                    if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
                        drawTile(WALL_COL, WALL_ROW, screenX, screenY);
                    } else {
                        ctx.fillStyle = '#d2a679'; 
                        ctx.fillRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                        ctx.strokeStyle = 'rgba(139, 90, 43, 0.2)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(screenX, screenY, DRAW_SIZE, DRAW_SIZE);
                    }
                }
            }

            // 4. 绘制小人（暂用粉色方块）
            const playerScreenX = playerX - cameraX;
            const playerScreenY = playerY - cameraY;
            
            ctx.fillStyle = '#ff2a6d'; 
            ctx.fillRect(playerScreenX, playerScreenY, DRAW_SIZE, DRAW_SIZE);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(playerScreenX, playerScreenY, DRAW_SIZE, DRAW_SIZE);

            // 屏幕中心十字
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(canvas.width/2 - 1, canvas.height/2 - 10, 2, 20);
            ctx.fillRect(canvas.width/2 - 10, canvas.height/2 - 1, 20, 2);
        }

        // 触摸控制变量
        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let dx = currentX - touchStartX;
            let dy = currentY - touchStartY;

            // 极简移动：滑动超过 15 像素，人物走一步，然后重置起点，防止瞬移
            if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) playerX += playerSpeed;
                    else playerX -= playerSpeed;
                } else {
                    if (dy > 0) playerY += playerSpeed;
                    else playerY -= playerSpeed;
                }
                
                // 每次移动后，把起点更新为当前位置，这样就能持续滑动了
                touchStartX = currentX;
                touchStartY = currentY;
            }

            // === 小人边界限制（空气墙） ===
            // 因为墙壁的厚度是 1 个格子（DRAW_SIZE），所以小人不能走到 <= 1 个格子的地方，也不能走到 >= 29 个格子的地方
            const MIN_X = DRAW_SIZE;
            const MAX_X = WORLD_WIDTH - DRAW_SIZE * 2;
            const MIN_Y = DRAW_SIZE;
            const MAX_Y = WORLD_HEIGHT - DRAW_SIZE * 2;

            if (playerX < MIN_X) playerX = MIN_X;
            if (playerX > MAX_X) playerX = MAX_X;
            if (playerY < MIN_Y) playerY = MIN_Y;
            if (playerY > MAX_Y) playerY = MAX_Y;
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        tileset.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
