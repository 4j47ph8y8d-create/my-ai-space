<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园 - 终极像素解析</title>
    <style>
        body { margin: 0; padding: 0; background-color: #12101a; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const TILE_SIZE = 32;
        const MAP_SIZE = 512; // 你的蓝图是 512x512
        const COLS = MAP_SIZE / TILE_SIZE;
        const ROWS = MAP_SIZE / TILE_SIZE;

        // 加载素材 (加上 v=1000 强制刷新)
        const imgBlueprint = new Image(); imgBlueprint.src = 'assets/furniture/farmhouse_overhaul.png?v=1000';
        const imgFloor = new Image(); imgFloor.src = 'assets/furniture/tile_floor_wood.png?v=1000';
        const imgWallpaper = new Image(); imgWallpaper.src = 'assets/furniture/tile_wall_basic.png?v=1000';
        const imgBaseboard = new Image(); imgBaseboard.src = 'assets/furniture/tile_wall_baseboard.png?v=1000';

        // 地图数据: 0=虚空, 1=地板, 2=墙壁
        let mapData = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

        // 用离屏 Canvas 扫描像素
        const offCanvas = document.createElement('canvas');
        offCanvas.width = MAP_SIZE; offCanvas.height = MAP_SIZE;
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        imgBlueprint.onload = function() {
            offCtx.drawImage(imgBlueprint, 0, 0);

            // 扫描每一个格子
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    // 检查格子的中心点是否有颜色（线框）
                    let px = offCtx.getImageData(c * TILE_SIZE + 16, r * TILE_SIZE + 16, 1, 1).data;
                    
                    if (px[3] > 0) {
                        // 如果中心点有颜色，可能是线框
                        mapData[r][c] = 2; 
                    } else {
                        // 如果中心点是透明的，大概率是房间内部
                        mapData[r][c] = 1; 
                    }
                }
            }

            // 为了确保边缘完全封闭，强制把最外围一圈设为虚空(0)
            for(let i=0; i<COLS; i++) { mapData[0][i] = 0; mapData[ROWS-1][i] = 0; }
            for(let i=0; i<ROWS; i++) { mapData[i][0] = 0; mapData[i][COLS-1] = 0; }

            render();
        };

        function render() {
            ctx.fillStyle = '#000'; // 虚空纯黑底
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let offsetX = (canvas.width - MAP_SIZE) / 2;
            let offsetY = (canvas.height - MAP_SIZE) / 2;

            // 1. 根据解析出的数据画地板和墙
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let sx = offsetX + c * TILE_SIZE;
                    let sy = offsetY + r * TILE_SIZE;
                    let cell = mapData[r][c];

                    if (cell === 1) {
                        // 铺地板
                        if (imgFloor.complete) ctx.drawImage(imgFloor, sx, sy, TILE_SIZE, TILE_SIZE);
                    } else if (cell === 2) {
                        // 贴墙纸和踢脚线
                        if (imgWallpaper.complete) ctx.drawImage(imgWallpaper, sx, sy, TILE_SIZE, TILE_SIZE);
                        if (r+1 < ROWS && mapData[r+1][c] === 1 && imgBaseboard.complete) {
                            ctx.drawImage(imgBaseboard, 0, 8, 16, 8, sx, sy + 16, TILE_SIZE, 16);
                        }
                    }
                }
            }

            // 2. 把你的蓝图原图盖在最上面，作为完美的“边框线条”！
            // 因为解析后，蓝图内部是没有线条的，它只会在边缘处盖住，这就形成了完美的房型
            if (imgBlueprint.complete) {
                ctx.drawImage(imgBlueprint, offsetX, offsetY, MAP_SIZE, MAP_SIZE);
            }
        }

        // 窗口缩放时重新渲染
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        });
    </script>
</body>
</html>
