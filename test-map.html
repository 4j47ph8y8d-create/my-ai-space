<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园 - 64x64 完美拼图</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const TILE_SIZE = 32;
        const MAP_COLS = 15;
        const MAP_ROWS = 12;

        // 0=虚空, 1=地板, 2=墙壁
        let mapData = Array(MAP_ROWS).fill(null).map(() => Array(MAP_COLS).fill(0));
        
        // 挖出两个房间
        for(let r = 1; r < 6; r++) {
            for(let c = 1; c < 8; c++) { mapData[r][c] = 1; }
        }
        for(let r = 6; r < 11; r++) {
            for(let c = 8; c < 14; c++) { mapData[r][c] = 1; }
        }
        // 走廊
        mapData[5][7] = 1; mapData[5][8] = 1; mapData[6][8] = 1;

        // 加载素材（加 v=2000 防止缓存）
        const imgFloor = new Image(); imgFloor.src = 'assets/furniture/tile_floor_wood.png?v=2000';
        const imgWallpaper = new Image(); imgWallpaper.src = 'assets/furniture/tile_wall_basic.png?v=2000';
        const imgBaseboard = new Image(); imgBaseboard.src = 'assets/furniture/tile_wall_baseboard.png?v=2000';
        
        // 你的 64x64 边缘墙壁
        const oT = new Image(); oT.src = 'assets/furniture/outer_wall_t.png';
        const oB = new Image(); oB.src = 'assets/furniture/outer_wall_b.png';
        const oL = new Image(); oL.src = 'assets/furniture/outer_wall_l.png';
        const oR = new Image(); oR.src = 'assets/furniture/outer_wall_r.png';
        const oTL = new Image(); oTL.src = 'assets/furniture/outer_wall_tl.png';
        const oTR = new Image(); oTR.src = 'assets/furniture/outer_wall_tr.png';
        const oBL = new Image(); oBL.src = 'assets/furniture/outer_wall_bl.png';
        const oBR = new Image(); oBR.src = 'assets/furniture/outer_wall_br.png';

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let offsetX = (canvas.width - (MAP_COLS * TILE_SIZE)) / 2;
            let offsetY = (canvas.height - (MAP_ROWS * TILE_SIZE)) / 2;

            // 1. 铺底层：地板、墙纸、踢脚线
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    let sx = offsetX + c * TILE_SIZE;
                    let sy = offsetY + r * TILE_SIZE;
                    let cell = mapData[r][c];

                    if (cell === 1) {
                        if (imgFloor.complete) ctx.drawImage(imgFloor, sx, sy, TILE_SIZE, TILE_SIZE);
                    } else if (cell === 2) {
                        // 如果是墙壁，先铺墙纸垫底
                        if (imgWallpaper.complete) ctx.drawImage(imgWallpaper, sx, sy, TILE_SIZE, TILE_SIZE);
                        
                        // 如果下方是地板，画踢脚线
                        if (r+1 < MAP_ROWS && mapData[r+1][c] === 1 && imgBaseboard.complete) {
                            ctx.drawImage(imgBaseboard, 0, 8, 16, 8, sx, sy + 16, TILE_SIZE, 16);
                        }
                    }
                }
            }

            // 2. 铺顶层：你的 64x64 无缝边框
            // 因为 64x64 刚好是 2x2 的格子，我们在遍历时，只需要遍历偶数格子（2, 4, 6...）来放置边框，防止重叠
            for (let r = 0; r < MAP_ROWS; r += 2) {
                for (let c = 0; c < MAP_COLS; c += 2) {
                    let sx = offsetX + c * TILE_SIZE;
                    let sy = offsetY + r * TILE_SIZE;
                    
                    let topVoid = (r - 1 < 0 || mapData[r-1][c] === 0);
                    let botVoid = (r + 2 >= MAP_ROWS || mapData[r+2][c] === 0);
                    let leftVoid = (c - 1 < 0 || mapData[r][c-1] === 0);
                    let rightVoid = (c + 2 >= MAP_COLS || mapData[r][c+2] === 0);

                    let outImg = null;
                    
                    // 寻找角
                    if (topVoid && leftVoid) outImg = oTL;
                    else if (topVoid && rightVoid) outImg = oTR;
                    else if (botVoid && leftVoid) outImg = oBL;
                    else if (botVoid && rightVoid) outImg = oBR;
                    // 寻找直边
                    else if (topVoid) outImg = oT;
                    else if (botVoid) outImg = oB;
                    else if (leftVoid) outImg = oL;
                    else if (rightVoid) outImg = oR;

                    if (outImg && outImg.complete) {
                        // 将 64x64 的图，强制画满 2x2 个格子（即 64x64 的像素空间）
                        ctx.drawImage(outImg, sx, sy, 64, 64);
                    }
                }
            }
        }

        function loop() {
            render();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
