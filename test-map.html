<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家园 - 完美大图叠加</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const TILE_SIZE = 32;

        // 加载你画的素材
        const imgBlueprint = new Image(); imgBlueprint.src = 'assets/furniture/farmhouse_overhaul.png?v=999';
        const imgFloor = new Image(); imgFloor.src = 'assets/furniture/tile_floor_wood.png?v=999';
        const imgWallpaper = new Image(); imgWallpaper.src = 'assets/furniture/tile_wall_basic.png?v=999';
        const imgBaseboard = new Image(); imgBaseboard.src = 'assets/furniture/tile_wall_baseboard.png?v=999';

        // 让图片居中
        let offsetX = 0;
        let offsetY = 0;

        function render() {
            ctx.fillStyle = '#12101a'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 大图尺寸假设是 512x512
            const mapWidth = 512;
            const mapHeight = 512;
            
            offsetX = (canvas.width - mapWidth) / 2;
            offsetY = (canvas.height - mapHeight) / 2;

            // 1. 把整个大图的范围里，全部铺满木地板
            for (let y = 0; y < mapHeight; y += TILE_SIZE) {
                for (let x = 0; x < mapWidth; x += TILE_SIZE) {
                    if (imgFloor.complete) {
                        ctx.drawImage(imgFloor, offsetX + x, offsetY + y, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // 2. 在上方墙壁（假设大图顶部的一条边是墙）画墙纸和踢脚线
            // 这里我们不用代码去猜，直接强制在 Y 轴 0 到 2 格的地方贴上墙纸和踢脚线（模拟星露谷上方墙壁）
            // 后面我们可以让你自己指定哪几行是墙。
            for (let x = 0; x < mapWidth; x += TILE_SIZE) {
                if (imgWallpaper.complete) {
                    ctx.drawImage(imgWallpaper, offsetX + x, offsetY, TILE_SIZE, TILE_SIZE);
                }
                if (imgBaseboard.complete) {
                    // 把踢脚线画在墙纸下方
                    ctx.drawImage(imgBaseboard, 0, 8, 16, 8, offsetX + x, offsetY + 16, TILE_SIZE, 16);
                }
            }

            // 3. 盖上天花板：把你画的 512 蓝图罩在最高层！
            // 因为蓝图中间是透明的，地板会漏出来，边缘的线框会完美地卡在最外层！
            if (imgBlueprint.complete) {
                ctx.drawImage(imgBlueprint, offsetX, offsetY, mapWidth, mapHeight);
            }
        }

        function loop() {
            render();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
