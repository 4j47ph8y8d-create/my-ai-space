<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>捏脸系统 - LunarReverie</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12101a;
            --panel: #1a1a24;
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --text: #e0e0e0;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text);
            font-family: 'ZCOOL QingKe HuangYou', 'VT323', monospace;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.5); border-bottom: 2px solid #333;
        }
        .back-btn { background: none; border: none; color: var(--neon-blue); font-size: 24px; cursor: pointer; font-family: inherit; }
        
        .preview-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px; position: relative;
        }
        .avatar-container {
            width: 260px; height: 260px;
            background: #2a2a35; border: 4px solid #444; border-radius: 10px;
            box-shadow: inset 0 0 20px #000, 0 0 20px rgba(255,255,255,0.1);
            position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #avatarCanvas {
            width: 100%; height: 100%; object-fit: contain;
            image-rendering: pixelated;
        }

        .options-panel {
            background: var(--panel); border-top: 2px solid #333;
            padding: 20px; height: 40vh; overflow-y: auto;
        }
        .option-group { margin-bottom: 25px; }
        .option-title { font-size: 20px; color: var(--neon-blue); margin-bottom: 10px; }
        
        .color-picker-row {
            display: flex; align-items: center; gap: 15px; margin-bottom: 15px;
        }
        .color-picker-row input[type="color"] {
            -webkit-appearance: none; border: none;
            width: 50px; height: 50px; border-radius: 8px; cursor: pointer;
            background: none; padding: 0;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-row input[type="color"]::-webkit-color-swatch { border: 3px solid #fff; border-radius: 8px; box-shadow: 0 4px 0 #000; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .pixel-btn {
            background: #333; border: 2px solid #555; color: #ccc;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: 18px; box-shadow: 0 3px 0 #000;
        }
        .pixel-btn.active { background: #555; border-color: #fff; color: #fff; }
        .pixel-btn:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.location.href='playground.html'">&lt; 返回</button>
        <div style="font-size: 24px; color: var(--neon-pink); font-weight: bold;">捏脸系统</div>
        <div style="width: 60px;"></div>
    </div>

    <div class="preview-area">
        <div class="avatar-container">
            <canvas id="avatarCanvas" width="256" height="256"></canvas>
        </div>
    </div>

    <div class="options-panel">
        <div class="option-group">
            <div class="option-title">发型选择</div>
            <div class="btn-group" id="hairStyleGroup">
                <button class="pixel-btn active" data-val="1">发型 1</button>
                <button class="pixel-btn" data-val="2">发型 2</button>
                <button class="pixel-btn" data-val="3">发型 3</button>
                <button class="pixel-btn" data-val="4">发型 4</button>
            </div>
        </div>

        <div class="option-group">
            <div class="option-title">颜色定制 (色盘)</div>
            <div class="color-picker-row">
                <span style="width: 60px;">发色</span>
                <input type="color" id="hairColorPicker" value="#ffffff">
            </div>
            <div class="color-picker-row">
                <span style="width: 60px;">瞳色</span>
                <input type="color" id="eyeColorPicker" value="#ff0000">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let config = {
            hairStyle: '1',
            hairColor: '#ffffff',
            eyeColor: '#ff0000' // 默认红瞳
        };

        // 定义图层（注意：你拆分了眼睛和嘴巴，我假设命名是 eye_1.png 和 mouth_1.png）
        // 如果你的文件名不一样，请在这里修改！
        const images = {
            body: new Image(),
            eye: new Image(),
            mouth: new Image(),
            hair: new Image()
        };
        
        images.body.src = 'assets/avatar/body.png';
        images.eye.src = 'assets/avatar/eye_1.png';     // 请确保你有这个文件
        images.mouth.src = 'assets/avatar/mouth_1.png'; // 请确保你有这个文件
        images.hair.src = 'assets/avatar/hair_1.png';

        let loadedCount = 0;
        const totalImages = 4;
        
        for(let key in images) {
            images[key].onload = () => {
                loadedCount++;
                if(loadedCount === totalImages) renderAvatar();
            }
            // 容错处理：如果某个图片没找到，也继续渲染
            images[key].onerror = () => {
                console.warn(`图片 ${key} 加载失败`);
                loadedCount++;
                if(loadedCount === totalImages) renderAvatar();
            }
        }

        function tintImage(img, targetColorHex, tintType) {
            if (!img.complete || img.naturalWidth === 0) return img; 
            
            const offCanvas = document.createElement('canvas');
            offCanvas.width = img.width;
            offCanvas.height = img.height;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(img, 0, 0);
            
            if (tintType === 'hair' && targetColorHex === '#ffffff') return img;

            const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const data = imgData.data;

            const r_target = parseInt(targetColorHex.slice(1, 3), 16);
            const g_target = parseInt(targetColorHex.slice(3, 5), 16);
            const b_target = parseInt(targetColorHex.slice(5, 7), 16);

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                const a = data[i+3];

                if (a > 0) {
                    if (tintType === 'eye') {
                        // 检测黑色/深色瞳孔
                        if (r < 60 && g < 60 && b < 60) {
                            data[i] = r_target;
                            data[i+1] = g_target;
                            data[i+2] = b_target;
                        }
                    } else if (tintType === 'hair') {
                        const brightness = (r + g + b) / 3 / 255; 
                        data[i] = r_target * brightness;
                        data[i+1] = g_target * brightness;
                        data[i+2] = b_target * brightness;
                    }
                }
            }
            offCtx.putImageData(imgData, 0, 0);
            return offCanvas;
        }

        function renderAvatar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 素体
            if(images.body.complete) ctx.drawImage(images.body, 0, 0, canvas.width, canvas.height);
            
            // 2. 眼睛 (染色)
            const tintedEye = tintImage(images.eye, config.eyeColor, 'eye');
            if(tintedEye.complete !== false) ctx.drawImage(tintedEye, 0, 0, canvas.width, canvas.height);
            
            // 3. 嘴巴 (不染色)
            if(images.mouth.complete) ctx.drawImage(images.mouth, 0, 0, canvas.width, canvas.height);
            
            // 4. 头发 (染色)
            const tintedHair = tintImage(images.hair, config.hairColor, 'hair');
            if(tintedHair.complete !== false) ctx.drawImage(tintedHair, 0, 0, canvas.width, canvas.height);
        }

        // 绑定发型按钮
        document.querySelectorAll('#hairStyleGroup .pixel-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#hairStyleGroup .pixel-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                config.hairStyle = e.target.dataset.val;
                images.hair.src = `assets/avatar/hair_${config.hairStyle}.png`;
                images.hair.onload = renderAvatar;
            });
        });

        document.getElementById('hairColorPicker').addEventListener('input', (e) => {
            config.hairColor = e.target.value;
            renderAvatar();
        });

        document.getElementById('eyeColorPicker').addEventListener('input', (e) => {
            config.eyeColor = e.target.value;
            renderAvatar();
        });
    </script>
</body>
</html>
