<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>捏脸系统 - LunarReverie</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12101a;
            --panel: #1a1a24;
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --text: #e0e0e0;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text);
            font-family: 'ZCOOL QingKe HuangYou', 'VT323', monospace;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.5); border-bottom: 2px solid #333;
        }
        .back-btn { background: none; border: none; color: var(--neon-blue); font-size: 24px; cursor: pointer; font-family: inherit; }
        
        .preview-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px; position: relative;
        }
        .avatar-container {
            width: 260px; height: 260px;
            /* 背景保持浅色，方便看清深色头发 */
            background: #3a3a45; border: 4px solid #444; border-radius: 10px;
            box-shadow: inset 0 0 20px #000, 0 0 20px rgba(255,255,255,0.1);
            position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        
        /* 核心渲染层：使用 DOM 叠加，比 Canvas 更快更稳 */
        .avatar-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* 眼睛颜色滤镜层 */
        #eyeTint {
            mix-blend-mode: color;
            opacity: 0.8; /* 控制染色强度 */
        }

        /* 头发颜色滤镜层 */
        #hairTint {
            mix-blend-mode: multiply;
        }

        .options-panel {
            background: var(--panel); border-top: 2px solid #333;
            padding: 20px; height: 40vh; overflow-y: auto;
        }
        .option-group { margin-bottom: 25px; }
        .option-title { font-size: 20px; color: var(--neon-blue); margin-bottom: 10px; }
        
        .color-picker-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .color-picker-row input[type="color"] {
            -webkit-appearance: none; border: none; width: 50px; height: 50px; border-radius: 8px; cursor: pointer; background: none; padding: 0;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-row input[type="color"]::-webkit-color-swatch { border: 3px solid #fff; border-radius: 8px; box-shadow: 0 4px 0 #000; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .pixel-btn {
            background: #333; border: 2px solid #555; color: #ccc;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: 18px; box-shadow: 0 3px 0 #000;
        }
        .pixel-btn.active { background: #555; border-color: #fff; color: #fff; }
        .pixel-btn:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href='playground.html'">&lt; 返回</button>
        <div style="font-size: 24px; color: var(--neon-pink); font-weight: bold;">捏脸系统</div>
        <div style="width: 60px;"></div>
    </div>
    
    <div class="preview-area">
        <div class="avatar-container">
            <!-- 使用 SVG 滤镜实现纯正染色，不改变原图结构 -->
            <svg width="0" height="0" style="position:absolute;">
                <filter id="hairTintFilter">
                    <feFlood flood-color="#ffffff" result="color"/>
                    <feComposite in="color" in2="SourceAlpha" operator="in" result="tint"/>
                    <feBlend in="SourceGraphic" in2="tint" mode="multiply"/>
                </filter>
                <filter id="eyeTintFilter">
                    <feFlood flood-color="#ff0000" result="color"/>
                    <feComposite in="color" in2="SourceAlpha" operator="in" result="tint"/>
                    <!-- 用 color 模式保留原图明暗 -->
                    <feBlend in="SourceGraphic" in2="tint" mode="color"/>
                </filter>
            </svg>

            <!-- 图层顺序：素体 -> 眼睛 -> 嘴巴 -> 头发 -->
            <img src="assets/avatar/body_male.png" class="avatar-layer" id="layerBody">
            
            <!-- 眼睛: 给它加红色滤镜 -->
            <img src="assets/avatar/eye_1.png" class="avatar-layer" id="layerEye" style="filter: url(#eyeTintFilter);">
            
            <!-- 嘴巴: 不加滤镜 -->
            <img src="assets/avatar/mouth_1.png" class="avatar-layer" id="layerMouth">
            
            <!-- 头发: 初始无滤镜(原图白色) -->
            <img src="assets/avatar/hair_1.png" class="avatar-layer" id="layerHair">
        </div>
    </div>

    <div class="options-panel">
        <div class="option-group">
            <div class="option-title">发型选择</div>
            <div class="btn-group" id="hairStyleGroup">
                <button class="pixel-btn active" data-val="1">发型 1</button>
                <button class="pixel-btn" data-val="2">发型 2</button>
                <button class="pixel-btn" data-val="3">发型 3</button>
                <button class="pixel-btn" data-val="4">发型 4</button>
            </div>
        </div>

        <div class="option-group">
            <div class="option-title">颜色定制</div>
            <div class="color-picker-row">
                <span style="width: 60px;">发色</span>
                <input type="color" id="hairColorPicker" value="#ffffff">
            </div>
            <div class="color-picker-row">
                <span style="width: 60px;">瞳色</span>
                <input type="color" id="eyeColorPicker" value="#ff0000">
            </div>
        </div>
    </div>

    <script>
        const layerHair = document.getElementById('layerHair');
        const layerEye = document.getElementById('layerEye');

        // 动态生成 SVG 滤镜的颜色（因为 SVG 里的 fill 不能直接用 JS 变量改）
        const svgDefs = document.querySelector('svg');
        
        function updateHairFilter(color) {
            let filter = document.getElementById('hairTintFilter');
            let flood = filter.querySelector('feFlood');
            flood.setAttribute('flood-color', color);
            
            // 如果选的是纯白，直接把滤镜清空，显示原图
            if(color === '#ffffff') {
                layerHair.style.filter = 'none';
            } else {
                layerHair.style.filter = 'url(#hairTintFilter)';
            }
        }

        function updateEyeFilter(color) {
            let filter = document.getElementById('eyeTintFilter');
            let flood = filter.querySelector('feFlood');
            flood.setAttribute('flood-color', color);
            layerEye.style.filter = 'url(#eyeTintFilter)';
        }

        // 绑定色盘事件
        document.getElementById('hairColorPicker').addEventListener('input', (e) => {
            updateHairFilter(e.target.value);
        });

        document.getElementById('eyeColorPicker').addEventListener('input', (e) => {
            updateEyeFilter(e.target.value);
        });

        // 绑定发型切换事件
        document.querySelectorAll('#hairStyleGroup .pixel-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#hairStyleGroup .pixel-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                let val = e.target.dataset.val;
                layerHair.src = `assets/avatar/hair_${val}.png`;
            });
        });
    </script>
</body>
</html>
